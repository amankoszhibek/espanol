<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#192536">
<title>Ruta Española — испанский с нуля до B1</title>
<style>
:root {
  color-scheme: light;
  --navy: #192536;
  --navy-deep: #152132;
  --ink: #1d2939;
  --muted: #5d6a79;
  --canvas: #f7f6f2;
  --paper: #fff;
  --line: #e8e6e0;
  --coral: #f18064;
  --coral-dark: #99422f;
  --peach: #fff0ea;
  --mint: #edf6f1;
  --green: #30644f;
  --radius: 19px;
  font-family: "Trebuchet MS", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; }
button { color: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
button:not(:disabled), summary { cursor: pointer; }
button:disabled { cursor: default; opacity: .52; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, main:focus-visible {
  outline: 3px solid #c55637; outline-offset: 4px;
}
button, a { touch-action: manipulation; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { line-height: 1.16; }
h1 { font-size: clamp(30px, 4vw, 47px); letter-spacing: -.045em; font-weight: 800; }
h2 { font-size: clamp(21px, 2.4vw, 28px); letter-spacing: -.034em; font-weight: 800; }
h3 { font-size: 17px; letter-spacing: -.014em; font-weight: 750; }
p { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; z-index: 4; left: 12px; top: -180px; background: white; border-radius: 7px; padding: 10px; }
.skip-link:focus { top: 12px; }
.icon { width: 20px; height: 20px; display: inline-block; flex: 0 0 auto; vertical-align: -.2em; }
.shell { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
.sidebar {
  position: sticky; top: 0; height: 100dvh; overflow: auto; min-height: 0;
  background: var(--navy-deep); color: white; display: flex; flex-direction: column; padding: 30px 16px 20px;
}
.brand { padding: 0 4px; margin: 0 0 51px; display: flex; gap: 11px; align-items: center; text-align: left; color: white; border: 0; background: none; }
.brand-mark {
  height: 41px; width: 41px; border-radius: 12px; color: #222638; background: var(--coral);
  display: grid; place-items: center; flex: 0 0 auto; font: bold 35px/.9 Georgia, serif;
}
.brand strong, .brand small, .sidebar-goal strong, .sidebar-goal small { display: block; white-space: nowrap; }
.brand strong { font-size: 16px; line-height: 1.06; letter-spacing: -.025em; }
.brand small { margin-top: 6px; font-size: 10px; color: #adb9c8; }
.navigation { display: grid; gap: 5px; }
.navigation-label { padding: 0 11px; margin: 0 0 7px; font-size: 10px; letter-spacing: .115em; color: #a1afc1; font-weight: 750; }
.navigation button {
  display: flex; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 10px;
  background: transparent; padding: 11px 10px; color: #c8d2df; font-size: 13px; font-weight: 650;
}
.navigation button:hover { background: #202f43; color: white; }
.navigation button[aria-current="page"] { background: #2a384b; color: #fff; }
.navigation button[aria-current="page"] .icon { color: #ff9679; }
.navigation .icon { width: 18px; height: 18px; }
.sidebar-goal {
  margin-top: auto; padding: 13px 10px; display: flex; align-items: center; gap: 8px;
  border: 1px solid #344154; border-radius: 13px; background: #1e2c3e;
}
.sidebar-goal-icon { color: #ff9c83; width: 31px; height: 31px; display: grid; place-items: center; background: #394053; border-radius: 8px; flex: 0 0 auto; }
.sidebar-goal strong { font-size: 12px; }
.sidebar-goal small { font-size: 10px; color: #b0bdcc; margin-top: 2px; }
.workspace { min-width: 0; }
.topbar {
  height: 72px; padding: 0 clamp(22px, 3.3vw, 54px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line); background: #fffefa;
}
.crumb, .top-controls { display: flex; gap: 10px; align-items: center; min-width: 0; }
.crumb { font-size: 13px; color: var(--muted); }
.crumb .icon { width: 17px; height: 17px; color: #975744; }
.crumb strong { color: var(--ink); font-weight: 760; }
.mode-label { color: var(--muted); font-size: 12px; }
.mode-switch {
  display: flex; flex: 0 0 auto; padding: 3px; gap: 3px; background: #f0efea;
  border: 1px solid #e8e5df; border-radius: 12px;
}
.mode-switch button {
  display: flex; align-items: center; gap: 5px; border: 0; border-radius: 8px;
  background: transparent; color: #596675; padding: 6px 9px; font-size: 12px; font-weight: 700;
}
.mode-switch button[aria-pressed="true"] { background: white; color: var(--ink); box-shadow: 0 1px 3px #1c28321a; }
.mode-switch .icon { width: 15px; height: 15px; }
.mode-switch button[aria-pressed="true"] .icon { color: var(--coral-dark); }
main { max-width: 1460px; min-height: calc(100vh - 140px); margin: 0 auto; padding: 30px clamp(22px, 3.3vw, 54px) 30px; }
main:focus { outline: none; }
.footer { max-width: 1460px; padding: 10px clamp(22px, 3.3vw, 54px) 23px; margin: 0 auto; display: flex; flex-wrap: wrap; column-gap: 15px; row-gap: 2px; color: var(--muted); font-size: 11px; }
.footer span:first-child { font-weight: 800; color: var(--ink); }

.hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg,#172536 2%,#172536f7 31%,#172536c9 52%,#17253642 80%,#17253617 100%);
}
.hero-copy { max-width: 470px; }
.hero h1 { font-size: clamp(38px, 5vw, 64px); line-height: .99; letter-spacing: -.061em; margin: 12px 0 14px; }
.hero h1 span { color: #ffa98f; }
.hero p { color: #e5ebf0; max-width: 380px; font-size: 15px; line-height: 1.55; margin-bottom: 20px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .105em; color: var(--coral-dark); text-transform: uppercase; }
.hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.hero .eyebrow { color: #ffd0c2; }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 15px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink);
  font-size: 13px; font-weight: 750; line-height: 1.3; text-decoration: none; min-height: 40px;
}
.button .icon { width: 16px; height: 16px; }
.button:not(:disabled):hover { background: #f7f6f1; }
.button.primary { background: var(--coral); color: #1e2634; border-color: var(--coral); }
.button.primary:not(:disabled):hover { background: #faa48f; }
.button.outline-light { background: #17253690; color: #fff; border-color: #b1bfd393; }
.button.outline-light:not(:disabled):hover { background: #324258; border-color: #fff; }
.button.dark { background: var(--navy); color: #fff; border-color: var(--navy); }
.button.dark:not(:disabled):hover { background: #2b4056; }
.text-button { border: 0; padding: 4px 0; background: transparent; color: var(--coral-dark); font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
.text-button .icon { width: 16px; height: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 13px; margin: 17px 0 26px; }
.stat { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 14px 15px; border: 1px solid var(--line); background: var(--paper); border-radius: 14px; }
.stat-icon { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 10px; color: #944b3a; background: var(--peach); }
.stat:nth-child(2) .stat-icon { background: #eef1fc; color: #475e94; }
.stat:nth-child(3) .stat-icon { background: var(--mint); color: var(--green); }
.stat strong, .stat small { display: block; }
.stat strong { font-size: 17px; font-weight: 800; letter-spacing: -.025em; }
.stat small { color: var(--muted); font-size: 11px; margin-top: 1px; }
.dashboard-grid, .practice-grid { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(245px,1fr); gap: 17px; align-items: start; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 11px; }
.section-title p { font-size: 13px; }
.panel { background: var(--paper); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; padding: 19px; min-width: 0; }
.panel > p { margin-top: 9px; }
.week-preview { display: flex; gap: 13px; align-items: flex-start; }
.week-preview h3 { margin: 5px 0 7px; }
.week-preview p { font-size: 13px; }
.week-preview-actions, .module-actions { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 10px; }
.week-square { display: grid; place-items: center; flex: 0 0 auto; min-width: 44px; height: 44px; background: var(--peach); color: #943c2a; border-radius: 11px; font-weight: 850; }
.soft-label { color: var(--coral-dark); font-size: 11px; font-weight: 800; letter-spacing: .055em; text-transform: uppercase; }
.routine { list-style: none; margin: -3px 0; padding: 0; }
.routine li { align-items: center; display: flex; justify-content: space-between; gap: 6px; padding: 7px 0; font-size: 13px; font-weight: 650; }
.routine li + li { border-top: 1px solid #efede8; }
.routine strong { font-variant-numeric: tabular-nums; color: var(--coral-dark); white-space: nowrap; font-size: 12px; }
.routine .icon { color: #7a665d; width: 16px; height: 16px; margin-right: 6px; }
.route-overview { margin-top: 25px; }
.levels { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; }
.level-card { text-align: left; font: inherit; color: inherit; display: block; min-width: 0; padding: 15px; border: 1px solid var(--line); background: #fff; border-radius: 14px; }
.level-card:hover { border-color: #d19786; }
.level-card strong { display: block; font-size: 14px; margin-top: 6px; }
.level-card small { color: var(--muted); font-size: 12px; }
.level-tag { display: inline-block; border-radius: 6px; padding: 2px 7px; background: var(--peach); color: var(--coral-dark); font-size: 11px; font-weight: 850; }
.level-tag.a2 { background: #eef1fc; color: #3e5589; }
.level-tag.b1 { background: var(--mint); color: var(--green); }
.page-heading { margin: 4px 0 21px; }
.page-heading h1 { margin: 6px 0 9px; }
.page-heading p { max-width: 650px; }
.selector { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.selector button {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px;
  background: #fff; font-size: 12px; color: var(--muted); font-weight: 750;
}
.selector button:hover { border-color: #d5a69a; }
.selector button[aria-pressed="true"] { background: var(--navy); color: white; border-color: var(--navy); }
.module { background: var(--navy); color: white; border-radius: var(--radius); padding: 22px; margin-bottom: 15px; }
.module h2 { margin: 8px 0 7px; }
.module p { color: #dee7ef; }
.module .book-line { margin-top: 9px; }
.module-actions { margin-top: 14px; }
.weeks { display: grid; gap: 9px; }
.week-detail { background: #fff; border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
.week-detail summary { padding: 12px; display: flex; align-items: center; gap: 10px; list-style: none; font-weight: 750; }
.week-detail summary::-webkit-details-marker { display: none; }
.week-detail summary .week-square { min-width: 36px; height: 36px; font-size: 13px; }
.week-detail summary .chevron { margin-left: auto; color: var(--muted); }
.week-detail[open] summary .chevron { transform: rotate(180deg); }
.week-detail summary:focus-visible { outline-offset: -4px; }
.week-title { flex: 1 1 auto; }
.done-badge { font-size: 11px; color: var(--green); background: var(--mint); border-radius: 6px; padding: 3px 6px; font-weight: 800; }
.week-content { padding: 0 14px 14px 59px; }
.week-content p + p { margin-top: 9px; }
.week-content strong { color: var(--ink); }
.week-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 13px; }
.weekly-writing { max-width: 760px; margin-top: 17px; padding: 16px; border: 1px solid #e5dfd5; border-radius: 12px; background: #faf9f5; }
.writing-instruction { margin-top: 5px; font-size: 13px; }
.writing-passage { padding: 10px 12px; border-left: 3px solid var(--coral); border-radius: 3px; background: white; color: var(--ink); }
.writing-question { margin-top: 14px; min-width: 0; }
.writing-question label { display: block; font-size: 14px; font-weight: 700; line-height: 1.45; }
.writing-question input {
  display: block; width: 100%; max-width: 540px; min-width: 0; padding: 8px 10px; margin: 5px 0 0;
  border: 1px solid #bdbbb4; border-radius: 7px; background: var(--paper); color: var(--ink); font-size: 16px;
}
.writing-question input[aria-invalid="true"] { border-color: #ae5742; }
.writing-question input[aria-invalid="false"] { border-color: #5d8a73; }
.writing-keys, .writing-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.writing-keys button { border: 1px solid #dcd7cd; border-radius: 6px; background: #fff; color: var(--ink); min-width: 30px; min-height: 30px; padding: 2px 6px; }
.writing-keys button:hover { background: var(--peach); }
.writing-actions { gap: 8px; margin-top: 15px; }
.writing-feedback:not(:empty), .writing-score:not(:empty) { margin-top: 5px; font-size: 13px; }
.writing-feedback:empty, .writing-score:empty { display: none; }
.writing-question:has(input[aria-invalid="true"]) .writing-feedback { color: var(--coral-dark); }
.writing-question:has(input[aria-invalid="false"]) .writing-feedback { color: var(--green); }
.writing-score:not(:empty) { margin-top: 10px; color: var(--ink); font-weight: 750; }

<script type="application/json" id="course-data">[{"title":"Первые фразы","level":"A1","goal":"Представиться, познакомиться и переспросить, если что-то непонятно.","book":"Ищи разделы об алфавите, ударении, личных местоимениях и глаголах ser, llamarse и tener.","weeks":[{"title":"Буквы и звуки","offline":"Прочитай по книге правила чтения. Выпиши 10 слов, подчеркни ударение и прочитай их вслух.","online":"Найди в Duolingo первые уроки испанского. Прослушай фразы и повтори каждую дважды.","outcome":"Могу прочитать 10 знакомых слов и назвать своё имя по буквам.","writing":{"questions":[{"prompt":"Какой буквы не хватает в испанском приветствии «_ola»? Впиши одну букву.","answers":["h"],"hint":"В начале этого слова пишется немая буква."},{"prompt":"Как по-испански называется буква ñ? Напиши её название.","answers":["eñe"],"hint":"В названии три буквы, и средняя из них — сама ñ."},{"prompt":"Поставь знак ударения в слове «cafe» (кофе). Напиши слово целиком.","answers":["café"],"hint":"В этом слове ударение падает на последний слог."}]}},{"title":"Приветствие и знакомство","offline":"Прочитай диалог месяца, замени имя и страну своими. Сыграй обе роли.","online":"Пройди уроки о знакомстве или повтори ближайшую доступную тему. Скажи ответы до проверки.","outcome":"Могу поздороваться, назвать своё имя и спросить имя собеседника.","writing":{"questions":[{"prompt":"Напиши по-испански «Доброе утро».","answers":["Buenos días","Buen día"],"hint":"В Испании в этом приветствии обычно используют дни во множественном числе."},{"prompt":"Представься именем Лусия. Me ___ Lucía. Используй llamarse.","answers":["llamo"],"hint":"Для yo глагол llamar оканчивается на -o."},{"prompt":"Спроси имя собеседника. ¿___ te llamas?","answers":["Cómo"],"hint":"Нужно вопросительное слово со значением «как»."}]}},{"title":"Страны, языки и числа","offline":"Сделай карточки с числами 0–30. Составь 6 фраз о том, откуда ты и на каких языках говоришь.","online":"Послушай короткую запись чисел и запиши 5 из них на слух.","outcome":"Могу назвать страну, возраст и продиктовать число до 30.","writing":{"questions":[{"prompt":"Запиши число 22 одним словом по-испански.","answers":["veintidós"],"hint":"Начни с veinti- и поставь знак ударения на ó."},{"prompt":"Вставь предлог. Soy ___ Perú. (Я из Перу.)","answers":["de"],"hint":"Происхождение выражают сочетанием ser и предлога."},{"prompt":"Назови язык. Hablo ___. (Я говорю по-испански.)","answers":["español","castellano"],"hint":"Название языка здесь употребляется без артикля."}]}},{"title":"Моя первая беседа","offline":"Составь диалог знакомства из 6 реплик. Повтори его со сменой ролей и добавь фразу ¿Puedes repetir?","online":"Найди короткий диалог о знакомстве. Попробуй понять имена и страны до просмотра субтитров.","outcome":"Могу говорить о себе 30 секунд и попросить повторить вопрос.","writing":{"questions":[{"prompt":"Попроси повторить вопрос. ¿Puedes ___ la pregunta?","answers":["repetir"],"hint":"После puedes нужен инфинитив «повторить»."},{"prompt":"Ответь собеседнику. — ¿De dónde eres? — ___ de Lima. (Я из Лимы.)","answers":["Soy","Yo soy"],"hint":"Нужна форма ser для первого лица."},{"prompt":"Составь реплику из трёх слов «llamo / Ana / me».","answers":["Me llamo Ana"],"hint":"Сначала поставь возвратное местоимение."}]}}],"review":"Представься за 30–45 секунд. Назови имя, страну и языки, затем задай два вопроса собеседнику.","dialogue":["Hola, me llamo Carla. ¿Cómo te llamas?","Me llamo Denis. ¿De dónde eres?","Soy de México. ¿Y tú?","Soy de Uzbekistán. Mucho gusto."],"prompt":"Представь, что знакомишься с новым одноклассником. Поздоровайся, представься и спроси, откуда он.","quiz":{"question":"Как правильно сказать «Я из Узбекистана»?","options":["Soy de Uzbekistán.","Tengo de Uzbekistán.","Me llamo de Uzbekistán."],"answer":0,"explanation":"Для происхождения используют ser de. Soy — форма глагола ser для yo."}},{"title":"Я и мой день","level":"A1","goal":"Рассказать о близких, привычках и любимых занятиях простыми фразами.","book":"Ищи темы семьи, времени, рода и числа существительных, настоящего времени, возвратных глаголов и gustar.","weeks":[{"title":"Семья и описание","offline":"Опиши 3 знакомых или вымышленных людей. Для каждого напиши две фразы с es и tiene.","online":"Потренируй лексику семьи в Duolingo. Повтори каждую фразу с другим человеком.","outcome":"Могу кратко представить близкого человека.","writing":{"questions":[{"prompt":"Назови родственницу. Mi ___ se llama Elena. (Мою сестру зовут Елена.)","answers":["hermana"],"hint":"Используй существительное женского рода."},{"prompt":"Впиши форму tener. Mi padre ___ cincuenta años.","answers":["tiene"],"hint":"Возраст выражают глаголом tener. Подлежащее здесь в единственном числе."},{"prompt":"Впиши форму ser. Mis abuelos ___ muy simpáticos.","answers":["son"],"hint":"Речь идёт о двух людях. Нужна форма для ellos."}]}},{"title":"Часы и распорядок","offline":"Подпиши свой распорядок на испанском. Скажи пять дел с указанием времени.","online":"Послушай 5 фраз со временем и запиши услышанные часы.","outcome":"Могу ответить на ¿A qué hora? и назвать 5 дел из своего дня.","writing":{"questions":[{"prompt":"На часах 8:30. Son las ocho y ___.","answers":["media","treinta"],"hint":"Для половины часа обычно используют слово media."},{"prompt":"Вставь возвратное местоимение. Yo ___ levanto a las siete.","answers":["me"],"hint":"Местоимение должно соответствовать yo."},{"prompt":"Переведи «в час дня» и дополни фразу. Almuerzo ___. Напиши время словами.","answers":["a la una de la tarde","a la una"],"hint":"Для часа используй одну в единственном числе и предлог a."}]}},{"title":"Действия в настоящем","offline":"Возьми по два глагола на -ar, -er и -ir. Составь с ними утверждения, вопросы и отрицания.","online":"Повтори упражнения на повседневные действия и проговори ответы вслух.","outcome":"Могу задать и понять простой вопрос о повседневном действии.","writing":{"questions":[{"prompt":"Впиши форму hablar. Nosotros ___ español :[{"title":"Комнаты и предметы","offline":"Нарисуй план квартиры. Подпиши 8 предметов и напиши 4 предложения с hay.","online":"Повтори лексику комнат и мебели в Duolingo. После упражнения назови предметы вокруг себя.","outcome":"Могу назвать комнаты и перечислить несколько предметов в них.","writing":{"questions":[{"prompt":"Сообщи, что на кухне есть стол. En la cocina ___ una mesa.","answers":["hay"],"hint":"Для сообщения о наличии предмета есть специальная форма haber."},{"prompt":"Назови предмет мебели. En el dormitorio hay una ___ para dormir. (кровать)","answers":["cama"],"hint":"Напиши слово без артикля, он уже стоит в предложении."},{"prompt":"Поставь silla во множественное число. En el salón hay dos ___.","answers":["sillas"],"hint":"После гласной во множественном числе добавляется -s."}]}},{"title":"Где это находится","offline":"Разложи предметы на столе. Составь 6 вопросов и ответов с está, están и предлогами места.","online":"Послушай простое описание комнаты и отметь, где находятся три предмета.","outcome":"Могу объяснить, где что лежит, используя delante de, al lado de и entre.","writing":{"questions":[{"prompt":"Впиши форму estar. ¿Dónde ___ las llaves?","answers":["están"],"hint":"Las llaves — множественное число. Проверь ударение."},{"prompt":"Переведи «между». La farmacia está ___ el banco y el cine.","answers":["entre"],"hint":"Для положения между двумя местами нужен один предлог."},{"prompt":"Переведи «рядом с» со словом lado. La lámpara está ___ la cama.","answers":["al lado de"],"hint":"После lado поставь предлог de."}]}},{"title":"Дорога по городу","offline":"Нарисуй квартал с 5 местами. Объясни два маршрута, используя recto, a la derecha и a la izquierda.","online":"Найди диалог о дороге. Нарисуй услышанный маршрут и сверься с субтитрами.","outcome":"Могу спросить, как пройти, и дать маршрут из трёх шагов.","writing":{"questions":[{"prompt":"Вставь «прямо». Sigue ___ hasta la plaza.","answers":["recto","todo recto","derecho","todo derecho"],"h , поездке и недавнем опыте.","book":"Ищи формы pretérito indefinido и pretérito perfecto compuesto, частые неправильные глаголы и указатели времени.","weeks":[{"title":"Завершённое действие","offline":"Напиши 6 фраз о вчерашнем дне с ayer, anoche и el lunes. Возьми три правильных глагола.","online":"Повтори доступные задания на прошедшее время. Найди пять форм прошедшего в коротком рассказе.","outcome":"Могу сказать, где был и что делал вчера, используя законченное прошлое.","writing":{"questions":[{"prompt":"Ayer yo ___ en casa. Впиши cenar в pretérito indefinido.","answers":["cené"],"hint":"Для yo у правильного глагола на -ar окончание -é."},{"prompt":"Anoche mis amigos ___ una película. Впиши mirar в pretérito indefinido.","answers":["miraron"],"hint":"Подлежащее во множественном числе, окончание -aron."},{"prompt":"El lunes tú ___ un mensaje. Впиши escribir в pretérito indefinido.","answers":["escribiste"],"hint":"Для tú у правильного глагола на -ir окончание -iste."}]}},{"title":"Поездка и события","offline":"Отработай fui, hice, tuve и estuve. Составь пять реплик о вымышленной поездке.","online":"Прослушай рассказ о выходных и запиши по порядку три действия.","outcome":"Могу ответить на вопросы, куда ездил и что там делал.","writing":{"questions":[{"prompt":"Вставь ir в pretérito indefinido. El sábado yo ___ a Córdoba en tren.","answers":["fui"],"hint":"У ir в прошедшем времени особая основа."},{"prompt":"Вставь hacer в pretérito indefinido. En el viaje nosotros ___ muchas fotos.","answers":["hicimos"],"hint":"Для nosotros используй основу hic-."},{"prompt":"Вставь tener в pretérito indefinido. Yo ___ tiempo de visitar el museo.","answers":["tuve"],"hint":"В этой форме используется основа tuv-."}]}},{"title":"Недавний опыт","offline":"Спроси и ответь на три вопроса с ¿Alguna vez has…? Отработай по книге he estado, he visto и he hecho.","online":"Послушай короткие примеры pretérito perfecto compuesto. Обрати внимание на выражения времени.","outcome":"Могу сказа авершившийся период. Fui — форма pretérito indefinido глагола ir для yo."}},{"title":"Истории и привычки","level":"A2","goal":"Описать прошлую ситуацию, отделить обстоятельства от главных событий и проверить A2.","book":"Ищи pretérito imperfecto, сравнение двух прошедших времён, прямые дополнения и связки para, porque, cuando.","weeks":[{"title":"Как было раньше","offline":"Напиши 6 фраз о детстве или вымышленном персонаже с antes, de pequeño и todos los días.","online":"Послушай короткий рассказ о детстве и найди три повторявшихся действия.","outcome":"Могу описать прежние привычки с imperfecto.","writing":{"questions":[{"prompt":"Опиши привычку в imperfecto. De niña, yo ___ en un pueblo. (vivir)","answers":["vivía"],"hint":"У правильных глаголов на -ir форма yo оканчивается на -ía."},{"prompt":"Опиши прежнюю привычку. Antes nosotros ___ al colegio a pie. (ir, imperfecto)","answers":["íbamos"],"hint":"У ir в imperfecto основа ib-. Учти знак ударения."},{"prompt":"Опиши район в прошлом. Mi barrio ___ muy tranquilo. (ser, imperfecto)","answers":["era"],"hint":"Нужна форма для él или ella."}]}},{"title":"Фон и событие","offline":"Напиши 5 пар «что происходило и что случилось». Используй cuando, hacía, estaba и одно завершённое действие в каждой паре.","online":"Прочитай короткий рассказ. Отметь события и описания разными цветами.","outcome":"Могу различить, что было фоном, и что произошло в конкретный момент.","writing":{"questions":[{"prompt":"Передай погоду как фон. ___ frío cuando llegué. (hacer, imperfecto)","answers":["Hacía"],"hint":"Для описания погоды здесь нужна форма третьего лица единственного числа."},{"prompt":"Внезапное событие. Mientras dormía, el teléfono ___ una vez. (sonar, indefinido)","answers":["sonó"],"hint":"Звонок произошёл один раз. Используй форму él в законченном прошлом."},{"prompt":"Покажи, что ожидание уже шло. Yo ___ esperando el autobús cuando te vi. (estar, imperfecto)","answers":["estaba"],"hint":"Сочетание estar в imperfecto с герундием описывает действие в процессе."}]}},{"title":"Не повторять предметы","offline":"Составь 8 коротких ответов с lo, la, los и las. Используй предметы из диалога о покупках или поездке.","online":"В коротком диалоге найди фразы с lo или la и отметь, к какому слову относится каждое местоимение.","outcome":"Могу ответить на знакомый вопрос короткой фразой вроде Sí, lo compré.","writing":{"questions":[{"prompt":"Замени la mochila одним местоимением. — ¿Compraste la mochila? — Sí, ___ compré.","answers":["la"],"hint":"Mochila — женский род, единственное число."},{"prompt":"Замени los billetes одним местоимением. — ¿Tienes los billetes? — Sí, ___ tengo.","answers":["los"],"hint":"Billetes — мужской род, множественное число."},{"prompt":"Перепиши «Compré las entradas», заменив las entradas местоимением. Напиши всю фразу.","answers":["Las compré","Yo las compré"],"hint":"Местоимение прямого дополнения встанет перед личной формой глагола."}]}},{"title":"Самопроверка A2","offline":"Напиши сообщение о поездке на 60–80 слов. Прочитай диалог месяца, закрой текст и перескажи его.","online":"Пройди задания образца DELE A2 на чтение и аудирование. Повтори одну часть после разбора ошибок.","outcome":"Могу написать понятное бытовое сообщение и пересказать простую историю.","writing":{"passage":"Ayer Marta perdió el autobús. Llamó a Pablo para avisarle y llegó al hotel a las ocho.","questions":[{"prompt":"Что Марта пропустила? Впиши два слова из текста, включая артикль.","answers":["el autobús"],"hint":"Ответ идёт сразу после perdió."},{"prompt":"С какой целью она позвонила? Выпиши два слова, начиная с предлога.","answers":["para avisarle"],"hint":"Оборот с para объясняет, зачем Марта позвонила."},{"prompt":"Когда она добралась до гостиницы? Впиши время словами вместе с предлогом.","answers":["a las ocho"],"hint":"Используй тот же оборот, что и в последнем предложении."}]}}],"review":"Напиши 60–80 слов о прошлом событии и расскажи его за две минуты. В разговоре ответь на два простых вопроса.","dialogue":["¿Cómo era el barrio donde vivías de pequeña?","Era tranquilo y siempre jugábamos en la calle.","¿Cuándo te mudaste?","Me mudé cuando tenía doce años."],"prompt":"Опиши, каким был твой район раньше, а затем расскажи об одном изменении, которое там произошло.","quiz":{"question":"Как сказать «Когда я жил там, я каждый день ходил пешком»?","options":["Cuando viví allí, camino todos los días.","Cuando vivo allí, caminé todos los días.","Cuando vivía allí, caminaba todos los días."],"answer":2,"explanation":"Vivía описывает длительную ситуацию, а caminaba — повторявшуюся в прошлом привычку."}},{"title":"Планы и договорённости","level":"B1","goal":"Договориться о встрече, обсудить варианты и объяснить планы или намерения.","book":"Ищи конструкции ir a + infinitivo, tener que, poder, будущее время и указатели времени.","weeks":[{"title":"Что я собираюсь делать","offline":"Сделай календарь предстоящей недели. Сформулируй 5 планов и 2 намерения с voy a.","online":"Послушай разговор о планах. Выпиши три намерения и перескажи их о собеседнике.","outcome":"Могу обсудить планы на неделю и уточнить время.","writing":{"questions":[{"prompt":"Расскажи о своём плане с ir a. Mañana yo ___ estudiar en la biblioteca.","answers":["voy a"],"hint":"Впиши форму ir для yo вместе с предлогом."},{"prompt":"Спроси о плане друга. ¿Qué ___ hacer el viernes? Используй ir a для tú.","answers":["vas a"],"hint":"Нужны два слова перед инфинитивом hacer."},{"prompt":"Впиши «собираемся поехать» с ir a + viajar. El domingo ___ en tren.","answers":["vamos a viajar","nosotros vamos a viajar","nosotras vamos a viajar"],"hint":"Начни с формы ir для nosotros и добавь viajar."}]}},{"title":"Встреча и перенос","offline":"Напиши приглашение и два ответа. В одном согласись, в другом объясни причину и предложи другое время.","online":"Проиграй разговор о переносе встречи с партнёром или отправь голосовое сообщение на испанском.","outcome":"Могу предложить время, вежливо отказаться и договориться о новом.","writing":{"questions":[{"prompt":"Предложи встретиться. ¿Te ___ quedar el sábado? Используй apetecer.","answers":["apetece"],"hint":"С одним инфинитивом quedar глагол ставится в единственном числе."},{"prompt":"Откажись, объяснив причину. Esta tarde no puedo, tengo ___ trabajar.","answers":["que"],"hint":"У tener есть конструкция со значением необходимости."},{"prompt":"Составь вопрос из слов «a / quedamos / siete / las».","answers":["¿Quedamos a las siete?","¿A las siete quedamos?"],"hint":"Сохрани оборот времени a las siete."}]}},{"title":"Предположения о будущем","offline":"Составь 6 прогнозов и обещаний с futuro simple. Проверь по книге формы podré, haré и tendré.","online":"Послушай короткий прогноз погоды или рассказ о планах. Найди формы будущего.","outcome":"Могу сделать простой прогноз и сформулировать обещание.","writing":{"questions":[{"prompt":"Дай обещание в futuro simple. Mañana yo ___ la reserva. (hacer)","answers":["haré"],"hint":"У hacer в будущем времени основа har-."},{"prompt":"Скажи, что мы сможем прийти. El sábado ___ venir. (poder, futuro simple, nosotros)","answers":["podremos"],"hint":"Используй основу podr- и окончание для nosotros."},{"prompt":"Сделай прогноз. Con el nuevo horario, tú ___ más tiempo libre. (tener, futuro simple)","answers":["tendrás"],"hint":"У tener в будущем времени основа tendr-."}]}},{"title":"Выбор из двух планов","offline":"Подготовь два варианта поездки. Сравни время, стоимость и удобство, а затем объясни выбор.","online":"Сравни две реальные поездки или мероприятия по испаноязычным описаниям и перескажи условия.","outcome":"Могу предложить два варианта и обосновать свой выбор.","writing":{"passage":"El tren cuesta 30 euros y tarda dos horas. El autobús cuesta 18 euros y tarda cuatro horas.","questions":[{"prompt":"По данным текста дополни фразу. El autobús es ___ que el tren. Используй barato.","answers":["más barato"],"hint":"Автобус стоит меньше, поэтому нужна сравнительная степень."},{"prompt":"Сравни длительность поездок. El tren tarda ___ tiempo que el autobús.","answers":["menos"],"hint":"Два часа меньше четырёх."},{"prompt":"Вставь союз причины. Prefiero el tren ___ llego antes. Используй одно слово.","answers":["porque"],"hint":"Объясни причину союзом, который пишется слитно."}]}}],"review":"Напиши приглашение на 70–90 слов. Назови время, место и запасной вариант, если планы изменятся.","dialogue":["¿Te apetece ir al cine el sábado?","Sí, pero tengo que trabajar hasta las seis.","Podemos quedar a las siete cerca del cine.","Perfecto. Si salgo tarde, te aviso."],"prompt":"Договорись с другом о встрече. Первое предложенное время не подходит, поэтому согласуйте другое.","quiz":{"question":"Чем закончить фразу «Если я освобожусь поздно, я тебе сообщу»?","options":["Si salgo tarde, te aviso.","Si saldré tarde, te aviso.","Si salgo tarde, te avisé."],"answer":0,"explanation":"В реальном условии после si используют настоящее время. Здесь основное действие тоже выражено настоящим с будущим смыслом."}},{"title":"Советы и пожелания","level":"B1","goal":"Дать бытовой совет и выразить просьбу, пожелание или рекомендацию.","book":"Ищи императив, обороты deberías и es mejor, а также формы presente de subjuntivo, если тема есть в издании.","weeks":[{"title":"Понятные инструкции","offline":"Напиши инструкцию из 5 шагов. Используй формы abre, espera, ven и no uses.","online":"Возьми короткую испаноязычную инструкцию и попробуй восстановить порядок действий после прослушивания.","outcome":"Могу дать несколько простых указаний и понять короткую инструкцию.","writing":{"questions":[{"prompt":"Дай указание одному другу на tú. ___ la aplicación. (abrir)","answers":["Abre"],"hint":"Нужен утвердительный императив для tú."},{"prompt":"Позови друга сюда. ___ aquí un momento. (venir, tú)","answers":["Ven"],"hint":"У venir короткая неправильная форма императива."},{"prompt":"Добавь глагол в запрет. No ___ el móvil en clase. (usar, tú)","answers":["uses"],"hint":"После no у отрицательного императива для tú окончание -es."}]}},{"title":"Советы другу","offline":"Придумай 3 бытовые проблемы. Дай к каждой два совета с deberías, puedes или te recomiendo.","online":"Послушай диалог о самочувствии или учёбе. Сформулируй свой совет по услышанной ситуации.","outcome":"Могу дать совет и объяснить, чем он поможет.","writing":{"questions":[{"prompt":"Дай мягкий совет с deber в condicional. Si estás cansado, ___ descansar un poco. Обращайся на tú.","answers":["deberías","tú deberías"],"hint":"К инфинитиву deber добавь окончание -ías."},{"prompt":"Предложи другу вариант с poder в presente. Si quieres practicar, tú ___ hablar con Ana.","answers":["puedes"],"hint":"Используй форму с чередованием o → ue."},{"prompt":"Переведи «советую тебе» с recomendar. ___ salir a caminar.","answers":["Te recomiendo","Yo te recomiendo"],"hint":"Поставь te перед глаголом в первом лице."}]}},{"title":"Первые формы subjuntivo","offline":"По возможности найди спряжение в книге. Возьми формы tengas, puedas, hagas и descanses из доступного справочника или выучи их как готовые фразы с espero que и te recomiendo que.","online":"Найди короткий урок о presente de subjuntivo после желаний и рекомендаций. Выпиши пять примеров и составь свои.","outcome":"Могу выразить простое пожелание или рекомендацию с que.","writing":{"questions":[{"prompt":"Вырази пожелание другу. Espero que ___ suerte. (tener, tú)","answers":["tengas"],"hint":"После espero que нужен presente de subjuntivo с основой teng-."},{"prompt":"Допиши совет. Te recomiendo que ___ una pausa. (hacer, tú)","answers":["hagas"],"hint":"Для hacer используй основу hag-."},{"prompt":"Вырази надежду, что друзья смогут прийти. Ojalá que ustedes ___ venir el domingo. (poder)","answers":["puedan"],"hint":"Нужна форма subjuntivo для ustedes с чередованием o → ue."}]}},{"title":"Просьбы и пожелания","offline":"Напиши сообщение другу, у которого важный день. Добавь два совета, просьбу и пожелание.","online":"Отправь голосовое сообщение с тремя советами партнёру по языку или запиши себя для самопроверки.","outcome":"Могу сформулировать просьбу и пожелание в связном сообщении.","writing":{"questions":[{"prompt":"Пожелай другу хорошо отдохнуть. Espero que ___ bien esta noche. (descansar, tú)","answers":["descanses"],"hint":"После espero que образуй subjuntivo от descansar."},{"prompt":"Попроси друзей написать тебе. Por favor, ___ cuando lleguen. (escribir + me, утвердительный императив для ustedes)","answers":["escríbanme"],"hint":"Присоедини me к escriban и сохрани ударение на í."},{"prompt":"Заверши фразу с пожеланием удачи. ¡Que te ___ bien mañana! (ir)","answers":["vaya"],"hint":"Здесь нужна особая форма ir в subjuntivo."}]}}],"review":"Дай три совета человеку, который плохо спит. Объясни причины и добавь одно пожелание с espero que.","dialogue":["Últimamente no duermo bien. ¿Qué puedo hacer?","Te recomiendo que apagues el móvil antes de acostarte.","Buena idea. También voy a tomar menos café.","Espero que descanses mejor esta noche."],"prompt":"Объясни другу, как подготовиться к важному разговору, и пожелай ему удачи.","quiz":{"question":"Как сказать «Надеюсь, что ты хорошо отдохнёшь»?","options":["Espero que descansas bien.","Espero que descanses bien.","Espero que descansar bien."],"answer":1,"explanation":"После espero que, когда у двух действий разные исполнители, здесь нужна форма subjuntivo descanses."}},{"title":"Решение бытовых проблем","level":"B1","goal":"Понятно описать проблему, вежливо попросить помощи и согласовать решение.","book":"Ищи темы путешествий и услуг, вежливых просьб, условного наклонения и местоимений дополнения.","weeks":[{"title":"В гостинице и в дороге","offline":"Возьми три ситуации с бронью, билетом и багажом. Для каждой объясни проблему двумя фразами и задай уточняющий вопрос.","online":"Послушай разговор об изменении брони или задержке транспорта. Запиши, как решилась проблема.","outcome":"Могу объяснить бытовую проблему в поездке и уточнить условия.","writing":{"questions":[{"prompt":"Объясни проблему на стойке багажа. Mi ___ no ha llegado. (чемодан)","answers":["maleta"],"hint":"Нужно слово женского рода в единственном числе."},{"prompt":"Дополни название письма одним словом. Aquí tiene mi correo de ___. (подтверждение)","answers":["confirmación"],"hint":"Нужно существительное от confirmar."},{"prompt":"Спроси, свободен ли номер. ¿Tienen alguna habitación ___ para esta noche? (свободная)","answers":["libre","disponible"],"hint":"Нужно прилагательное со значением «доступная для бронирования»."}]}},{"title":"Вежливые просьбы","offline":"Перепиши пять просьб с помощью ¿Podría…? и ¿Le importaría…? Прочитай их вслух с вопросительной интонацией.","online":"Разыграй разговор с сотрудником отеля, сервиса или магазина. Уточни одну деталь повторным вопросом.","outcome":"Могу вежливо предложить решение и переспросить, если ответ непонятен.","writing":{"questions":[{"prompt":"Обратись к сотруднику на usted. ¿___ repetir el número, por favor? Впиши poder в condicional.","answers":["Podría","Podría usted","Usted podría"],"hint":"У poder в condicional основа podr-."},{"prompt":"Впиши importar в condicional. ¿Le ___ hablar un poco más despacio?","answers":["importaría"],"hint":"К полному инфинитиву прибавь окончание -ía."},{"prompt":"Попроси коллег на ustedes прислать документ. ¿___ enviarme la confirmación? Используй poder в condicional.","answers":["Podrían","Podrían ustedes","Ustedes podrían"],"hint":"Здесь просят нескольких людей, поэтому нужно окончание -ían."}]}},{"title":"Письмо о проблеме","offline":"Напиши письмо об ошибочной брони. Укажи дату, опиши ошибку и попроси исправить её.","online":"Прочитай испаноязычный пример письма в службу поддержки. Выпиши подходящие приветствие и заключение.","outcome":"Могу написать короткое вежливое письмо с понятной просьбой.","writing":{"questions":[{"prompt":"Допиши начало письма. Les escribo en relación ___ mi reserva.","answers":["con"],"hint":"Устойчивый оборот en relación требует предлога con."},{"prompt":"Попроси исправить дату. Les ruego que ___ la fecha de llegada. (corregir, ustedes)","answers":["corrijan"],"hint":"Просьба с que требует subjuntivo. Основа этой формы — corrij-."},{"prompt":"Закончи письмо, ожидая ответа адресата. Quedo a la ___ de su respuesta.","answers":["espera"],"hint":"Используй существительное от esperar."}]}},{"title":"Добиться решения","offline":"Сыграй обе роли в диалоге о неверном билете. Предложи два решения и согласуй одно из них.","online":"Поговори с партнёром по языку или обменяйся голосовыми сообщениями по предложенной ситуации.","outcome":"Могу уточнить проблему, предложить альтернативу и проговорить итог договорённости.","writing":{"questions":[{"prompt":"Предложи альтернативу с poder в condicional. Si le parece bien, nosotros ___ cambiar el billete.","answers":["podríamos"],"hint":"Условная форма для nosotros оканчивается на -íamos."},{"prompt":"Подтверди согласие двумя словами. — ¿Le va bien el jueves? — ___, muchas gracias. Используй acuerdo.","answers":["De acuerdo"],"hint":"Начни с предлога de."},{"prompt":"Подведи итог договорённости. Entonces, ¿quedamos ___ que me enviará el nuevo billete hoy?","answers":["en"],"hint":"Оборот quedar en que вводит то, о чём договорились."}]}}],"review":"Напиши 90–110 слов о неверной брони. Затем разыграй разговор и договорись о новой дате.","dialogue":["Buenos días. Mi reserva aparece para el martes, pero pedí el jueves.","Lo compruebo. ¿Tiene el correo de confirmación?","Sí, se lo puedo enseñar. ¿Podría cambiar la fecha?","Sí, todavía tenemos una habitación libre para el jueves."],"prompt":"Объясни сотруднику вокзала, что дата в билете неверная. Попроси заменить билет и уточни, есть ли доплата.","quiz":{"question":"Как вежливо попросить поменять дату?","options":["¿Cuándo cambió la fecha?","¿La fecha podría cambiarme?","¿Podría cambiar la fecha, por favor?"],"answer":2,"explanation":"Форма podría делает просьбу вежливой. После неё используют инфинитив cambiar."}},{"title":"Новости и личные истории","level":"B1","goal":"Понять главное в ясном рассказе и пересказать его с важными подробностями.","book":"Повтори прошедшие времена. Ищи давнопрошедшее время (pretérito pluscuamperfecto), косвенную речь и связки mientras, por eso и aunque, если эти темы есть.","weeks":[{"title":"Событие и предыстория","offline":"Возьми короткий текст из книги. Выпиши, кто участвовал, что случилось и что произошло до основного события.","online":"Послушай двухминутный выпуск новостей для изучающих. С первого раза определи тему, со второго уточни три детали.","outcome":"Могу выделить тему, участников и основные события короткого сообщения.","writing":{"passage":"Cuando llegó Laura, el concierto ya había empezado. Un empleado la acompañó hasta su asiento.","questions":[{"prompt":"Какое событие произошло раньше прихода Лауры? Впиши два слова из текста. El concierto ya ___.","answers":["había empezado"],"hint":"Найди форму pluscuamperfecto в первой фразе."},{"prompt":"Кто помог Лауре? Выпиши существительное с неопределённым артиклем.","answers":["un empleado"],"hint":"Ответ находится в начале второго предложения."},{"prompt":"Куда её проводили? Дополни словами из текста. La acompañó hasta ___.","answers":["su asiento"],"hint":"После hasta указано место Лауры в зале."}]}},{"title":"Порядок событий","offline":"Построй линию времени для личной истории. Скажи había terminado или había salido, чтобы отметить более раннее действие.","online":"Повтори урок или видео о pretérito pluscuamperfecto. Приведи три примера из собственной истории.","outcome":"Могу показать, какое из двух событий в прошлом произошло раньше.","writing":{"questions":[{"prompt":"К нашему приходу поезд уже ушёл. Cuando llegamos, el tren ya ___. Используй salir в pluscuamperfecto.","answers":["había salido"],"hint":"Возьми haber в imperfecto и причастие salir."},{"prompt":"Поставь terminar в pluscuamperfecto. Cuando llamaste, nosotros ya ___ el informe.","answers":["habíamos terminado"],"hint":"У nosotros вспомогательный глагол имеет окончание -íamos."},{"prompt":"Дополни предысторию. No pudieron entrar porque ___ las llaves en casa. (dejar, ellos, pluscuamperfecto)","answers":["habían dejado"],"hint":"Ключи оставили до того, как попытались войти."}]}},{"title":"Передаём чужие слова","offline":"Перепиши 5 реплик как пересказ с dijo que, explicó que или contó que. Для начала используй простой образец из диалога месяца.","online":"Послушай короткое интервью и перескажи два высказывания от лица рассказчика.","outcome":"Могу своими словами передать основную мысль собеседника.","writing":{"questions":[{"prompt":"Передай реплику Аны «Estoy cansada» в прошедшем времени. Ana dijo que ___ cansada. Используй imperfecto.","answers":["estaba","ella estaba"],"hint":"Личная форма меняется на третье лицо."},{"prompt":"Луис сказал «Tengo miedo». Заполни пропуск формой imperfecto. Luis explicó que ___ miedo.","answers":["tenía","él tenía"],"hint":"Используй форму tener для él и проверь ударение."},{"prompt":"Передай вопрос «¿Vienes?» как косвенный. Me preguntó ___ iba. Вставь союз.","answers":["si"],"hint":"Косвенный вопрос с ответом «да» или «нет» вводится союзом без ударения."}]}},{"title":"Пересказ с деталями","offline":"Выбери историю из книги или диалог месяца. Составь 5 опорных слов и перескажи содержание без чтения.","online":"Прослушай новый короткий сюжет два раза. Перескажи его за 2 минуты и проверь три факта.","outcome":"Могу связно рассказать о событии и уточнить его обстоятельства.","writing":{"passage":"Mientras Irene esperaba el autobús, empezó a llover. Por eso entró en una cafetería. Al salir, vio que ya había dejado de llover.","questions":[{"prompt":"Выпиши слово, которое вводит действие, служившее фоном для начала дождя.","answers":["mientras"],"hint":"Это первое слово рассказа."},{"prompt":"Выпиши два слова, которые обозначают следствие дождя.","answers":["Por eso"],"hint":"Эта связка стоит перед entró."},{"prompt":"Выпиши форму из текста. Cuando Irene salió, ya ___ de llover.","answers":["había dejado"],"hint":"Дождь прекратился до её выхода из кафе."}]}}],"review":"Перескажи новую короткую историю за две минуты. Назови главное событие, три детали и его итог.","dialogue":["¿Has leído la noticia sobre el festival?","Sí. Dijeron que habían vendido todas las entradas.","¿Y qué pasó cuando empezó a llover?","Cambiaron el concierto de lugar y avisaron al público por mensaje."],"prompt":"Перескажи новость или вымышленное событие. Уточни, что произошло раньше и чем всё закончилось.","quiz":{"question":"Как сказать «Когда мы приехали, концерт уже начался»?","options":["Cuando llegamos, el concierto ya había empezado.","Cuando llegamos, el concierto ya empieza.","Cuando llegamos, el concierto ya empezará."],"answer":0,"explanation":"Había empezado отмечает действие, которое произошло раньше другого момента в прошлом."}},{"title":"Мнение и аргументы","level":"B1","goal":"Высказать мнение, привести примеры и отреагировать на чужую точку зрения.","book":"Ищи выражения мнения, союзы причины и противопоставления, условные фразы, а также subjuntivo после некоторых выражений.","weeks":[{"title":"Мнение и причина","offline":"Выбери знакомую тему, например учёбу или транспорт. Напиши мнение, две причины и один конкретный пример.","online":"Прослушай интервью на знакомую тему. Выдели, что человек думает и чем обосновывает своё мнение.","outcome":"Могу ясно высказать позицию и привести две причины.","writing":{"questions":[{"prompt":"Введи мнение глаголом creer. Yo ___ que aprender idiomas merece la pena.","answers":["creo"],"hint":"Нужна форма presente для yo."},{"prompt":"Дополни связку «например». Por ___, puedo leer noticias en español.","answers":["ejemplo"],"hint":"Связка вводит конкретный пример."},{"prompt":"Соедини позицию и причину, используя ya. Prefiero estudiar por la mañana, ya ___ me concentro mejor.","answers":["que"],"hint":"Из ya и второго слова получается союз причины."}]}},{"title":"Плюсы и минусы","offline":"Сравни два способа учиться. Напиши 90–110 слов, используя por un lado, por otro lado и sin embargo.","online":"Прочитай короткий испаноязычный пост с обсуждением. Сформулируй один аргумент каждой стороны.","outcome":"Могу сравнить варианты, признать недостаток и объяснить свой выбор.","writing":{"questions":[{"prompt":"Начни сравнение. Por un ___, las clases en línea son cómodas.","answers":["lado"],"hint":"Устойчивый оборот означает «с одной стороны»."},{"prompt":"Введи обратную сторону той же мысли. Por ___ lado, echo de menos a mis compañeros.","answers":["otro"],"hint":"Здесь начинается вторая часть сравнения."},{"prompt":"Допиши связку «тем не менее». Estudiar en casa es cómodo. Sin ___, a veces cuesta concentrarse.","answers":["embargo"],"hint":"Нужна вторая часть связки sin embargo."}]}},{"title":"Ответ собеседнику","offline":"Сыграй мини-дискуссию в двух ролях. Попробуй Estoy de acuerdo, Entiendo tu punto de vista и En mi caso.","online":"Обсуди привычную тему с партнёром либо подготовь голосовой ответ на испаноязычный комментарий для своей практики.","outcome":"Могу согласиться, вежливо возразить и задать уточняющий вопрос.","writing":{"questions":[{"prompt":"Согласись с другом. Estoy de ___ contigo.","answers":["acuerdo"],"hint":"Сочетание estar de … означает «быть согласным»."},{"prompt":"Покажи, что понимаешь позицию друга. Entiendo tu punto de ___.","answers":["vista"],"hint":"Законченный оборот означает «точка зрения»."},{"prompt":"Попроси уточнить, что собеседник имеет в виду. ¿A qué te ___ exactamente? Используй referirse для tú.","answers":["refieres"],"hint":"В этой форме e переходит в ie. Местоимение te уже есть."}]}},{"title":"Короткое выступление","offline":"Запиши трёхминутный монолог. Проверь, есть ли мнение, две причины, пример и вывод.","online":"Прослушай выступление на похожую тему. Сравни набор аргументов и потренируй ответы на два вопроса.","outcome":"Могу развивать мысль несколько минут и ответить на вопросы по теме.","writing":{"questions":[{"prompt":"Открой первый аргумент. En ___ lugar, aprender en grupo permite intercambiar ideas.","answers":["primer"],"hint":"Перед существительным мужского рода primero сокращается."},{"prompt":"Добавь ещё один довод. ___, en grupo puedo practicar con varias personas. Впиши одно слово со значением «кроме того».","answers":["Además","Asimismo","Igualmente","También"],"hint":"Один из вариантов начинается на ade- и имеет ударение на последнем слоге."},{"prompt":"Введи вывод словами «в заключение». En ___, aprender con otras personas me ayuda a seguir practicando.","answers":["conclusión"],"hint":"После en нужно существительное от concluir."}]}}],"review":"В течение трёх минут объясни своё мнение на знакомую тему. Дай две причины, пример и ответ на возражение.","dialogue":["Creo que estudiar en casa tiene muchas ventajas.","En parte estoy de acuerdo, pero a veces cuesta concentrarse.","Es verdad. En mi caso, me ayuda seguir un horario.","Tiene sentido. También podría probarlo."],"prompt":"Объясни, как, по-твоему, удобнее учить язык. Приведи две причины и ответь на возможное возражение.","quiz":{"question":"Какой вариант подходит, чтобы ввести возражение?","options":["Por eso.","Sin embargo.","Por ejemplo."],"answer":1,"explanation":"Sin embargo означает «однако» и вводит противопоставление предыдущей мысли."}},{"title":"Итоговая практика B1","level":"B1","goal":"Проверить чтение, аудирование, письмо и речь, затем отработать слабые места.","book":"Вернись к разделам и примерам, где чаще ошибался. Проверь прошедшие времена, связки, просьбы и выражения мнения.","weeks":[{"title":"Понимание текста","offline":"Возьми незнакомый текст из книги. За один проход найди тему, затем пять деталей. Сформулируй краткое резюме.","online":"Выполни задания официального образца DELE B1 по чтению с ограничением времени и сверь ответы.","outcome":"Могу определить главную мысль, намерение автора и важные детали обычного текста.","writing":{"passage":"Esta semana, la biblioteca del barrio cerrará a las seis para reparar la calefacción. Los préstamos que venzan el viernes podrán devolverse el lunes sin multa.","questions":[{"prompt":"Во сколько будет закрываться библиотека? Выпиши из объявления время вместе с предлогом.","answers":["a las seis"],"hint":"Найди время после cerrará."},{"prompt":"Что будут ремонтировать? Впиши ответ по тексту с определённым артиклем.","answers":["la calefacción"],"hint":"После reparar названо то, что требует ремонта."},{"prompt":"В какой день разрешено вернуть книги без штрафа? Впиши день недели по-испански.","answers":["lunes","el lunes"],"hint":"Найди день, следующий в тексте после podrán devolverse."}]}},{"title":"Понимание речи","offline":"Если заранее сохранил аудио, послушай незнакомый отрывок дважды. Без аудио прочитай диалог вслух и потренируй пересказ.","online":"Выполни задания официального образца DELE B1 по аудированию. Отметь, какие детали потерялись.","outcome":"После практики с записью могу уловить главную мысль и ключевые детали ясной речи.","writing":{"listen":true,"questions":[{"prompt":"Послушай диалог. Какой глагол пропущен в первой части ответа? Al principio, ___ a la gente…","answers":["entender"],"hint":"Собеседнику было трудно понимать людей на слух."},{"prompt":"Как говорили люди? Впиши слово из записи. …cuando hablaba ___.","answers":["rápido"],"hint":"Нужно слово, которое отвечает на вопрос ¿cómo? Проверь ударение."},{"prompt":"Сколько раз собеседник слушал диалоги? Впиши два услышанных слова. Escuchar diálogos ___ y después…","answers":["varias veces"],"hint":"Ответ означает «несколько раз»."}]}},{"title":"Письмо и разговор","offline":"Напиши 100–120 слов по знакомой теме, затем проговори трёхминутный ответ и проверь связки, формы глаголов и понятность.","online":"Возьми задания официального образца DELE B1 по письму и речи. Покажи ответ собеседнику или преподавателю, если есть возможность.","outcome":"Могу построить связный текст и аргументированно ответить на обычные вопросы.","writing":{"questions":[{"prompt":"Передай цель письма. Te escribo ___ invitarte al encuentro del sábado.","answers":["para"],"hint":"Перед инфинитивом цели нужен предлог."},{"prompt":"Предложи время вежливо. ¿Te ___ bien quedar a las seis? Используй parecer в condicional.","answers":["parecería"],"hint":"К parecer добавь окончание -ía."},{"prompt":"Попроси друга подтвердить участие. Avísame cuando ___ si puedes venir. (saber, tú, о будущем)","answers":["sepas"],"hint":"После cuando для будущего события здесь нужен subjuntivo."}]}},{"title":"Пробный B1","offline":"Используй заранее сохранённые задания, аудио и ключи. Выполни доступные части по времени, проверь ответы и выпиши три темы для повторения.","online":"Сделай полный пробный DELE B1 по правилам образца. Попроси оценить речь и письмо по критериям экзамена, если есть партнёр.","outcome":"У меня есть результаты пробных заданий по четырём навыкам и список тем для повторения.","writing":{"passage":"Tu tren de las diez se ha cancelado. La compañía te ofrece viajar a las doce sin pagar más. También puedes solicitar un reembolso.","questions":[{"prompt":"Сколько придётся доплатить за поезд на двенадцать? Напиши число по-испански словами. ___ euros.","answers":["cero"],"hint":"Выражение sin pagar más означает, что доплаты нет."},{"prompt":"Вежливо запроси возврат денег. Si es posible, me ___ solicitar un reembolso. Используй gustar в condicional.","answers":["gustaría"],"hint":"Здесь нужна форма третьего лица единственного числа."},{"prompt":"Подтверди, что произойдёт, если ты выберешь другой поезд. Si tomo el tren de las doce, no ___ más. (pagar, yo, futuro simple)","answers":["pagaré","yo pagaré"],"hint":"После реального условия si + настоящее время используй будущее в главной части."}]}}],"review":"Выполни пробные задания B1 по четырём навыкам. Сверь чтение и аудирование с ключами, письмо и речь — с критериями официального образца.","dialogue":["¿Qué ha sido lo más difícil de aprender español?","Al principio, entender a la gente cuando hablaba rápido.","¿Y qué te ha ayudado a mejorar?","Escuchar diálogos varias veces y después intentar contarlos con mis propias palabras."],"prompt":"Расскажи, как ты учил испанский, что изменилось за год и какую цель хочешь поставить дальше.","quiz":{"question":"Какой вопрос помогает проверить, понятна ли главная мысль текста?","options":["¿Cuántas palabras tiene el texto?","¿Cuál es la primera preposición del texto?","¿Qué quiere comunicar el autor?"],"answer":2,"explanation":"Чтобы понять главную мысль, определи, что автор хочет сообщить читателю."}}]</script>
<script type="application/json" id="card-data">[[["¡Hola! ¿Qué tal?","Привет! Как дела?"],["Buenos días.","Доброе утро."],["Me llamo Ana.","Меня зовут Ана."],["Mucho gusto.","Очень приятно."],["¿De dónde eres?","Откуда ты?"],["Soy de Uzbekistán.","Я из Узбекистана."],["Vivo en Taskent.","Я живу в Ташкенте."],["¿Puedes repetir, por favor?","Можешь повторить, пожалуйста?"],["Hasta luego.","До встречи."]],[["Tengo dos hermanos.","У меня два брата."],["Me levanto a las siete.","Я встаю в семь."],["desayunar","завтракать"],["¿Qué hora es?","Который час?"],["Son las ocho y media.","Сейчас половина девятого."],["de lunes a viernes","с понедельника по пятницу"],["por la tarde","днём / ближе к вечеру"],["Me gusta leer.","Мне нравится читать."],["Me acuesto temprano.","Я рано ложусь спать."]],[["En mi casa hay dos dormitorios.","У меня дома две спальни."],["La cocina está al lado del salón.","Кухня находится рядом с гостиной."],["La mesa está junto a la ventana.","Стол стоит рядом с окном."],["¿Dónde está la estación?","Где находится станция?"],["Sigue todo recto.","Иди прямо."],["Gira a la izquierda.","Поверни налево."],["enfrente del museo","напротив музея"],["a cinco minutos a pie","в пяти минутах ходьбы"],["la parada de autobús","автобусная остановка"]],[["¿Cuánto cuesta?","Сколько это стоит?"],["Quisiera un café con leche.","Я бы хотел(а) кофе с молоком."],["un vaso de agua","стакан воды"],["¿Qué me recomienda?","Что вы мне посоветуете?"],["La cuenta, por favor.","Счёт, пожалуйста."],["¿Puedo pagar con tarjeta?","Можно оплатить картой?"],["medio kilo de tomates","полкило помидоров"],["¿Tiene una talla más grande?","У вас есть размер побольше?"],["Me lo llevo.","Я это беру."]],[["el billete de ida y vuelta","билет туда и обратно"],["reservar una habitación","забронировать номер"],["el año pasado","в прошлом году"],["Llegamos anoche.","Мы приехали вчера вечером."],["Pasé tres días en Madrid.","Я провёл / провела три дня в Мадриде."],["El vuelo salió con retraso.","Рейс вылетел с опозданием."],["¿A qué hora llegaste?","Во сколько ты приехал(а)?"],["Hoy he visitado dos museos.","Сегодня я посетил(а) два музея."],["¿Alguna vez has viajado en tren?","Ты когда-нибудь ездил(а) на поезде?"]],[["Cuando era pequeño/a...","Когда я был(а) маленьким / маленькой…"],["De niño, vivía cerca del mar.","В детстве я жил недалеко от моря."],["Solíamos salir juntos.","Мы обычно куда-нибудь ходили вместе."],["de repente","вдруг"],["Mientras esperaba, empezó a llover.","Пока я ждал(а), пошёл дождь."],["Al principio me daba miedo.","Поначалу мне было страшно."],["Compré las entradas y las guardé en el bolso.","Я купил(а) билеты и убрал(а) их в сумку."],["¿Viste el mensaje? Sí, lo vi.","Ты видел(а) сообщение? Да, видел(а)."],["Al final todo salió bien.","В конце концов всё вышло хорошо."]],[["¿Qué vas a hacer mañana?","Что ты собираешься делать завтра?"],["Voy a quedarme en casa.","Я собираюсь остаться дома."],["¿Te apetece dar un paseo?","Хочешь прогуляться?"],["¿A qué hora quedamos?","Во сколько встретимся?"],["¿Podemos quedar un poco más tarde?","Можем встретиться чуть позже?"],["Tengo que cambiar la cita.","Мне нужно перенести встречу."],["El sábado hará buen tiempo.","В субботу будет хорошая погода."],["Si tengo tiempo, me apuntaré.","Если у меня будет время, я запишусь."],["Prefiero ir en tren porque es más cómodo.","Я предпочитаю поехать поездом, потому что так удобнее."]],[["Me duele la garganta.","У меня болит горло."],["pedir cita con el médico","записаться к врачу"],["Descansa un poco.","Немного отдохни."],["No te acuestes tan tarde.","Не ложись так поздно."],["Deberías beber más agua.","Тебе стоит пить больше воды."],["Es mejor que llames primero.","Лучше, если ты сначала позвонишь."],["Te recomiendo que lo pruebes.","Советую тебе это попробовать."],["Espero que te mejores pronto.","Надеюсь, ты скоро поправишься."],["Quiero que me avises al llegar.","Я хочу, чтобы ты сообщил(а) мне, когда доберёшься."]],[["La calefacción de la habitación no funciona.","В номере не работает отопление."],["El tren se ha cancelado.","Поезд отменили."],["¿Podría ayudarme a resolverlo?","Не могли бы вы помочь мне решить эту проблему?"],["Solicito un reembolso.","Я прошу вернуть деньги."],["¿Es posible cambiarlo por otro?","Можно обменять это на другое?"],["Adjunto una copia del recibo.","Прикладываю копию чека."],["Quedo a la espera de su respuesta.","Буду ждать вашего ответа."],["Si le parece bien, podemos buscar otra solución.","Если вас устроит, мы можем найти другое решение."],["Llevo media hora esperando.","Я жду уже полчаса."]],[["estar al tanto de las noticias","быть в курсе новостей"],["Según el periódico…","По данным газеты…"],["La noticia cuenta que…","В новости рассказывается, что…"],["Antes de salir, ya había comprado las entradas.","Перед выходом я уже купил(а) билеты."],["Cuando llegamos, la reunión ya había empezado.","Когда мы пришли, встреча уже началась."],["Me dijo que tenía prisa.","Он(а) сказал(а) мне, что торопится."],["Llegó tarde porque había perdido el autobús.","Он(а) опоздал(а), потому что не успел(а) на автобус."],["Aunque llovía, salimos de casa.","Хотя шёл дождь, мы вышли из дома."],["Desde entonces…","С тех пор…"]],[["Desde mi punto de vista…","С моей точки зрения…"],["Estoy de acuerdo contigo.","Я с тобой согласен / согласна."],["No lo veo así.","Я смотрю на это иначе."],["Una ventaja es que cuesta menos.","Одно из преимуществ в том, что это стоит дешевле."],["El principal inconveniente es el ruido.","Главный недостаток — шум."],["Es importante que todos participemos.","Важно, чтобы мы все участвовали."],["Una posible solución sería reutilizar más.","Одно из возможных решений — чаще использовать вещи повторно."],["Si hubiera más autobuses, usaría menos el coche.","Если бы было больше автобусов, я реже ездил(а) бы на машине."],["Entiendo tu punto, pero hay otra opción.","Я понимаю твою точку зрения, но есть и другой вариант."]],[["en primer lugar","во-первых"],["por un lado… por otro lado…","с одной стороны… с другой стороны…"],["además","кроме того"],["sin embargo","однако"],["Es decir, cuesta menos de lo que parece.","То есть это стоит меньше, чем кажется."],["Por ejemplo, podríamos empezar hoy.","Например, мы могли бы начать сегодня."],["Por eso, conviene reservar con tiempo.","Поэтому лучше бронировать заранее."],["Lo que más me preocupa es el precio.","Меня больше всего беспокоит цена."],["En resumen, hay varias alternativas.","Подводя итог, можно сказать, что есть несколько вариантов."]]]</script>
