n":"Entre означает «между». Panadería — булочная, mercado — рынок."},{"question":"Как спросить прохожего, как добраться до библиотеки?","options":["Perdona, ¿a qué hora abre la biblioteca?","Perdona, ¿cómo llego a la biblioteca?","Perdona, ¿qué hay en la biblioteca?"],"answer":1,"explanation":"¿Cómo llego a…? помогает спросить, как добраться до места."},{"question":"«Sigue recto y gira a la derecha en la primera calle». Как идти?","options":["Прямо, затем направо на первой улице.","Прямо, затем налево на первой улице.","Направо на второй улице."],"answer":0,"explanation":"Sigue recto значит «иди прямо», a la derecha — «направо», primera calle — «первая улица»."},{"question":"«Vivo cerca del parque. Voy al centro en autobús porque mi trabajo está lejos». Как человек добирается до центра?","options":["Пешком через парк.","На метро.","На автобусе."],"answer":2,"explanation":"En autobús значит «на автобусе». Cerca del parque сообщает, где живёт человек."}],[{"question":"Как заказать в кафе салат и чай?","options":["¿La ensalada lleva té?","Para mí, una ensalada y un té, por favor.","Prefiero el té a la ensalada."],"answer":1,"explanation":"Para mí, …, por favor — обычная формула заказа. Y перечисляет два блюда или напитка."},{"question":"«Cuesta quince euros con cincuenta céntimos». Какая это цена?","options":["15,50 €.","50,15 €.","15,05 €."],"answer":0,"explanation":"Quince euros — 15 евро, cincuenta céntimos — 50 центов."},{"question":"Как попросить полкилограмма помидоров?","options":["Medio litro de tomates, por favor.","Un kilo y medio de tomates, por favor.","Medio kilo de tomates, por favor."],"answer":2,"explanation":"Medio kilo — полкилограмма, un kilo y medio — полтора килограмма."},{"question":"Как сказать «Этот хлеб дешевле того»?","options":["Este pan es tan barato como ese.","Ese pan es más barato que este.","Este pan es más barato que ese."],"answer":2,"explanation":"Más barato que означает «дешевле, чем». Este pan — этот хлеб, ese — тот."},{"question":"Тебе принесли картофель, а ты хочешь салат. Как попросить заменить гарнир?","options":["¿Puede cambiar las patatas por una ensalada?","¿Puede traer las patatas con una ensalada?","¿Puede quitar la ensalada?"],"answer":0,"explanation":"Cambiar A por B значит «заменить A на B». Con una ensalada означало бы «с салатом»."},{"question":"Официант говорит «El menú vale doce euros. Incluye sopa y pollo, pero la bebida se paga aparte». Что нужно оплатить отдельно?","options":["Суп.","Напиток.","Курицу."],"answer":1,"explanation":"La bebida se paga aparte значит «напиток оплачивается отдельно». Суп и курица входят в меню."}],[{"question":"Как сказать «В понедельник мы ужинали дома» о прошедшем понедельнике?","options":["El lunes cenamos en casa.","El lunes cené en casa.","El lunes cenaron en casa."],"answer":0,"explanation":"Мы — nosotros. В pretérito indefinido форма cenamos относится к nosotros, cené — к yo, cenaron — к ellos или ustedes."},{"question":"Закончи предложение «Ayer ___ que salir temprano» от лица yo.","options":["tenías","tengo","tuve"],"answer":2,"explanation":"Tuve que salir значит «мне пришлось уйти». Tuve — форма завершённого прошедшего для yo."},{"question":"Как спросить «Ты когда-нибудь видел море?», используя pretérito perfecto compuesto?","options":["¿Alguna vez has ver el mar?","¿Alguna vez has visto el mar?","¿Alguna vez ha visto el mar?"],"answer":1,"explanation":"Для tú нужна форма has. После неё употребляют причастие visto."},{"question":"Как ответить на «¿Adónde fuiste el sábado?», если ты ездил на пляж?","options":["Fui a la playa.","Estuve en la playa el domingo.","Hice una excursión a la montaña."],"answer":0,"explanation":"Adónde спрашивает, куда человек отправился. Fui a la playa отвечает на вопрос о направлении."},{"question":"«Primero compramos los billetes. Después tomamos el tren y al final llegamos a la costa». Что сделали сразу после покупки билетов?","options":["Приехали на побережье.","Сели в поезд.","Купили ещё билеты."],"answer":1,"explanation":"Después указывает на следующее действие. Tomamos el tren означает, что они сели на поезд."},{"question":"«El sábado quisimos visitar el museo, pero estaba cerrado. Así que fuimos al parque y volvimos a casa a las seis». Почему они пошли в парк?","options":["Домой нужно было вернуться к шести.","В музее не было билетов на утро.","Музей был закрыт."],"answer":2,"explanation":"Estaba cerrado означает «был закрыт». Así que вводит следствие, то есть поход в парк."}],[{"question":"Как сказать «В детстве я каждое лето купался в реке»?","options":["De pequeño me bañé en el río una vez.","De pequeño me bañaba en el río todos los veranos.","De pequeño me baño en el río todos los veranos."],"answer":1,"explanation":"Me bañaba в imperfecto выражает повторявшееся действие. Todos los veranos значит «каждое лето»."},{"question":"Как сказать «Шёл дождь, когда я вышел из дома»?","options":["Llovía cuando salí de casa.","Llovió cuando salía de casa.","Llueve cuando salgo de casa."],"answer":0,"explanation":"Llovía описывает фоновое действие. Salí указывает на конкретный момент выхода."},{"question":"На вопрос «¿Viste a Marta ayer?» ответь «Да, я видел её».","options":["Sí, lo vi.","Sí, las vi.","Sí, la vi."],"answer":2,"explanation":"La заменяет a Marta. Это прямое дополнение женского рода в единственном числе."},{"question":"«¿Compraste los billetes?». Как ответить «Да, я их купил»?","options":["Sí, la compré.","Sí, los compré.","Sí, lo compré."],"answer":1,"explanation":"Los заменяет los billetes. Это прямое дополнение мужского рода во множественном числе."},{"question":"Как сказать «Я остался дома, потому что устал»?","options":["Me quedé en casa para descansar.","Me quedé en casa cuando me llamaste.","Me quedé en casa porque estaba cansado."],"answer":2,"explanation":"Porque объясняет причину, estaba cansado значит «я был уставшим». Para вводит цель."},{"question":"«Antes vivíamos cerca del colegio e íbamos a pie. El año pasado nos mudamos a otro barrio. Ahora vamos en autobús». Что изменилось после переезда?","options":["Теперь до школы ездят на автобусе.","Теперь живут ближе к школе.","Теперь ходят до школы пешком."],"answer":0,"explanation":"Antes íbamos a pie описывает прежнюю привычку. Ahora vamos en autobús сообщает, как они добираются теперь."}],[{"question":"Выбери естественный ответ на вопрос «¿Qué vas a hacer este fin de semana?». Собеседница хочет рассказать о своём плане посетить друзей.","options":["Voy a visitar a unos amigos.","Acabo de visitar a unos amigos.","Voy de visita con unos amigos."],"answer":0,"explanation":"Voy a visitar передаёт намерение. Acabo de visitar говорит о недавнем прошлом, а con unos amigos означает «с друзьями»."},{"question":"Лусия пишет «El martes no puedo quedar antes de las seis. ¿Te viene bien a las siete?». Какой ответ подтверждает предложенное время?","options":["El martes a las cinco me viene bien.","Lo dejamos para el miércoles a las siete.","Perfecto, nos vemos el martes a las siete."],"answer":2,"explanation":"Лусия предлагает вторник в семь. Nos vemos подтверждает встречу в это время."},{"question":"Как сказать «Мне нужно закончить работу до пяти, но потом я могу встретиться»?","options":["Puedo terminar el trabajo antes de las cinco, pero después tengo que quedar.","Tengo que terminar el trabajo antes de las cinco, pero después puedo quedar.","Tengo que terminar el trabajo después de las cinco, pero puedo quedar antes."],"answer":1,"explanation":"Tengo que обозначает необходимость, antes de las cinco означает «до пяти», а después puedo quedar сообщает, когда встреча возможна."},{"question":"Закончи прогноз «Según el pronóstico, mañana ___ viento en la costa».","options":["hará","hacía","ha hecho"],"answer":0,"explanation":"Hará — будущее время глагола hacer. О погоде говорят hará viento."},{"question":"Матео предлагает музей, Инес — парк. Какая реплика даёт запасной вариант на случай дождя?","options":["Aunque llovió, fuimos al parque.","Llovió porque el museo estaba cerrado.","Si llueve, podemos ir al museo en vez de al parque."],"answer":2,"explanation":"Si llueve задаёт условие, а en vez de вводит замену. При дожде предлагается пойти в музей вместо парка."},{"question":"Как вежливо попросить перенести встречу на более позднее время, сохранив тот же день?","options":["¿Te importa si quedamos otro día?","¿Te viene bien quedar un poco más tarde ese mismo día?","¿Te parece si adelantamos la cita media hora?"],"answer":1,"explanation":"Más tarde означает «позже», а ese mismo día — «в тот же день». Adelantar предполагает более раннее время."}],[{"question":"Выбери отрицательную инструкцию для друга. «Не открывай окно».","options":["No abre la ventana.","No abras la ventana.","No abres la ventana."],"answer":1,"explanation":"Для отрицательной команды на tú используется форма subjuntivo abras."},{"question":"Коллеге трудно сосредоточиться в шумном офисе. Какая реплика советует ему перейти в более тихое место?","options":["Ojalá hubiera menos ruido aquí.","No me sorprende que haya tanto ruido.","Podrías trabajar en la sala de al lado, que es más tranquila."],"answer":2,"explanation":"Форма podrías помогает дать мягкий совет. В реплике предлагается соседняя комната и названа причина."},{"question":"Закончи рекомендацию, обращённую к другу. «Te recomiendo que ___ siempre una botella de agua».","options":["lleves","llevas","llevarás"],"answer":0,"explanation":"После te recomiendo que используется subjuntivo. Форма для tú — lleves."},{"question":"Прочитай инструкцию. «Pulsa el botón verde. Cuando se encienda la luz, espera diez segundos antes de abrir la tapa». Что нужно сделать после того, как загорится лампочка?","options":["Нажать зелёную кнопку и сразу открыть крышку.","Подождать десять секунд, затем открыть крышку.","Открыть крышку и подождать десять секунд."],"answer":1,"explanation":"Espera diez segundos antes de abrir la tapa означает «подожди десять секунд перед тем, как открыть крышку»."},{"question":"Как пожелать другу, чтобы его собеседование прошло хорошо?","options":["Me alegro de que te haya ido bien en la entrevista.","Seguro que te va bien en la entrevista.","Que te vaya bien en la entrevista."],"answer":2,"explanation":"Оборот que + subjuntivo выражает пожелание. Te haya ido bien в первом варианте относится к уже прошедшему событию."},{"question":"Выбери сообщение, которое просит адресата позвонить по прибытии.","options":["Por favor, llámame cuando llegues.","Por favor, te llamo cuando llegue.","Por favor, dime cuándo llegaste."],"answer":0,"explanation":"Llámame означает «позвони мне». Когда речь о будущем прибытии, в придаточном с cuando употребляется llegues."}],[{"question":"В отеле тебе назначили номер с одной кроватью. Как объяснить, что ты бронировал(а) номер с двумя отдельными кроватями?","options":["Reservé dos habitaciones con una cama individual.","¿Hay una habitación con cama doble?","En mi reserva consta una habitación con dos camas individuales."],"answer":2,"explanation":"Una habitación con dos camas individuales — один номер с двумя отдельными кроватями. En mi reserva consta означает «в моём бронировании указано»."},{"question":"Какая фраза вежливо просит сотрудника проката проверить счёт ещё раз?","options":["¿Le importaría revisar la factura otra vez?","¿Volvió a revisar la factura?","¿Me permite revisar la factura otra vez?"],"answer":0,"explanation":"¿Le importaría revisar…? обращает просьбу к сотруднику. Me permite просит разрешить говорящему провести проверку самому."},{"question":"Магазин отвечает «Podemos cambiarle el producto sin coste alguno. Para el reembolso, necesitamos el recibo original». Что они согласны сделать без дополнительных расходов?","options":["Выдать дубликат чека.","Обменять товар.","Вернуть деньги без чека."],"answer":1,"explanation":"Cambiarle el producto sin coste alguno означает «бесплатно обменять товар». Для возврата денег нужен оригинал чека."},{"question":"Как корректно заменить оба дополнения в фразе «Voy a enviar la confirmación a usted»?","options":["Voy a enviársela.","Voy a enviárlela.","Voy a enviárselo."],"answer":0,"explanation":"La заменяет la confirmación, а перед la косвенное местоимение le превращается в se. С инфинитивом получается enviársela."},{"question":"Нужно письменно попросить вернуть сумму за отменённую экскурсию. Какое предложение ясно формулирует просьбу?","options":["Le confirmo que asistiré a la excursión en la nueva fecha.","Quisiera cancelar mi solicitud de reembolso.","Les agradecería que me devolvieran el importe de la excursión cancelada."],"answer":2,"explanation":"Devolver el importe означает «вернуть уплаченную сумму». Les agradecería que делает письменную просьбу вежливой."},{"question":"Сотрудник говорит «No quedan billetes para las ocho, pero puedo reservarle uno para el tren de las nueve sin coste adicional». Какой ответ принимает предложение и уточняет итог?","options":["Entonces esperaré al tren de las ocho.","De acuerdo, confírmeme el billete de las nueve al mismo precio, por favor.","¿Cuánto tengo que pagar para cancelar el billete de las nueve?"],"answer":1,"explanation":"Сотрудник предлагает поезд в девять без доплаты. Ответ подтверждает и время, и прежнюю цену."}],[{"question":"Какое событие произошло первым? «Cuando Paula llegó al aeropuerto, ya habían anunciado el retraso del vuelo».","options":["Самолёт вылетел.","Паула приехала в аэропорт.","Объявили о задержке рейса."],"answer":2,"explanation":"Ya habían anunciado показывает, что объявление прозвучало до приезда Паулы."},{"question":"Анна сказала «No tengo tiempo para ir hoy». Как передать её слова, если разговор состоялся вчера?","options":["Ana dijo que no tenía tiempo para ir ese día.","Ana dijo que no tuve tiempo para ir ese día.","Ana dijo que no tuvo tiempo para ir al día siguiente."],"answer":0,"explanation":"В таком пересказе tengo превращается в tenía, а hoy — в ese día. Формы относятся к Анне и к тому же дню."},{"question":"Прочитай заметку. «El ayuntamiento cerró el puente el lunes tras detectar daños. Los autobuses llegarán al centro por la avenida Norte hasta que terminen las obras». Какое изменение важно для пассажиров?","options":["Движение автобусов по мосту возобновилось в понедельник.","До конца работ автобусы едут в центр по другой улице.","Автобусы не ходят в центр до конца работ."],"answer":1,"explanation":"Автобусы продолжают ходить в центр, но используют avenida Norte до завершения ремонта."},{"question":"Вставь связку, которая объясняет последствие. «Perdimos el último autobús, ___ tuvimos que volver a pie».","options":["mientras","aunque","por eso"],"answer":2,"explanation":"Por eso означает «поэтому» и связывает пропущенный автобус с возвращением пешком."},{"question":"Какой вариант передаёт, что готовка уже шла в тот момент, когда позвонили?","options":["Preparaba la cena cuando sonó el teléfono.","Había preparado la cena antes de que sonara el teléfono.","Cuando sonó el teléfono, me puse a preparar la cena."],"answer":0,"explanation":"Preparaba описывает действие, которое шло в момент звонка. Había preparado обозначает уже законченную готовку, а me puse — её начало."},{"question":"«Aunque la exposición iba a durar dos semanas, el museo decidió ampliarla un mes más por el número de visitantes». Что произошло в итоге?","options":["Выставку отменили из-за низкой посещаемости.","Музей продлил выставку ещё на месяц из-за числа посетителей.","Музей сократил выставку до двух недель."],"answer":1,"explanation":"Ampliarla un mes más означает «продлить её ещё на месяц», а por el número de visitantes объясняет причину."}],[{"question":"Как закончить фразу, чтобы признать достоинство варианта и назвать его недостаток? «El tren es más cómodo. ___, el último sale demasiado temprano».","options":["por eso","sin embargo","es decir"],"answer":1,"explanation":"Sin embargo вводит противопоставление. Удобству поезда противопоставлено раннее время отправления."},{"question":"Собеседник говорит «El centro debería ser solo para peatones». Как вежливо признать его довод и предложить учесть исключение?","options":["No veo de qué podemos hablar.","Exacto, no tiene sentido hacer excepciones.","Entiendo tu idea, pero ¿qué haríamos con los vehículos de emergencia?"],"answer":2,"explanation":"Entiendo tu idea признаёт позицию собеседника. Вопрос про аварийные службы поднимает возможное исключение."},{"question":"Закончи гипотетическое предложение. «Si el barrio tuviera más zonas verdes, más gente ___ a pasear».","options":["saldría","salió","había salido"],"answer":0,"explanation":"В гипотезе si + tuviera задаёт воображаемое условие. Его предполагаемый результат выражается формой saldría."},{"question":"«Teletrabajar ahorra tiempo en desplazamientos. Aun así, para quienes viven solos, reunirse con el equipo en persona puede ser importante». Какова мысль автора?","options":["Автор предлагает всем работать только из офиса.","Удалённая работа экономит время, а личные встречи тоже могут иметь значение.","Автор считает удалённую работу подходящей только для тех, кто живёт один."],"answer":1,"explanation":"Aun así добавляет оговорку к преимуществу удалённой работы. Личные встречи могут быть важны, например, для людей, которые живут одни."},{"question":"Как закончить сомнение «No creo que esa medida ___ el problema».","options":["resuelve","resolver","resuelva"],"answer":2,"explanation":"После no creo que здесь употребляется subjuntivo. Форма для esa medida — resuelva."},{"question":"Какая реплика выражает мнение и сразу приводит конкретную причину?","options":["En mi opinión, conviene ampliar el horario de la biblioteca porque muchos salen tarde del trabajo.","Me parece bien ampliar el horario. Por cierto, la biblioteca está cerca de mi casa.","El horario nuevo ya se ha publicado en la página web de la biblioteca."],"answer":0,"explanation":"En mi opinión вводит позицию. Porque связывает предложение продлить часы работы с поздним окончанием рабочего дня."}],[{"question":"Определи цель сообщения. «El curso de fotografía gratuito empieza el viernes. Como solo hay quince plazas, envíanos un correo antes del miércoles si quieres participar».","options":["Попросить оплатить курс до среды.","Перенести начало курса на среду.","Сообщить о курсе и попросить записаться заранее."],"answer":2,"explanation":"Объявление сообщает о бесплатном курсе и предлагает написать до среды, чтобы записаться при ограниченном количестве мест."},{"question":"Какой ответ подходит на сообщение «Como no pudiste venir, te reservamos un sitio para la próxima sesión. Avísanos si no te interesa»? Ты всё ещё хочешь прийти.","options":["Gracias por reservarme la plaza. Confirmo que iré a la próxima sesión.","Gracias por venir. Espero que podáis asistir a la próxima sesión.","Gracias por el aviso. Prefiero que le deis mi plaza a otra persona."],"answer":0,"explanation":"Confirmo que iré однозначно подтверждает участие. Последний ответ просит отдать место другому."},{"question":"Какая связка вводит конкретный пример? «Hay maneras sencillas de gastar menos agua. ___, podemos cerrar el grifo mientras nos lavamos los dientes».","options":["En cambio","Por ejemplo","En resumen"],"answer":1,"explanation":"Por ejemplo связывает общую мысль с конкретным способом экономии воды."},{"question":"Выбери заключение к отзыву. «El alojamiento estaba bien situado y era limpio. Sin embargo, tuvimos que esperar dos horas para entrar y nadie nos explicó la razón».","options":["Volvería sin dudarlo porque la recepción fue rápida y muy atenta.","No lo recomendaría porque está demasiado lejos del centro.","Lo recomendaría por su ubicación, aunque deberían mejorar la atención al llegar."],"answer":2,"explanation":"Заключение учитывает удобное расположение и предлагает улучшить приём гостей."},{"question":"Из объявления нужно узнать, можно ли прийти без предварительной регистрации. Какой вопрос решает задачу?","options":["¿Hace falta apuntarse antes para poder entrar?","¿Puedo cambiar mis datos después de apuntarme?","¿Cuánto dura la actividad una vez que empieza?"],"answer":0,"explanation":"¿Hace falta apuntarse antes? означает «Нужно ли записаться заранее?». Остальные вопросы про изменение данных и длительность."},{"question":"«El grupo decidió salir más tarde para evitar la tormenta. Cuando llegaron a la montaña, el cielo ya se había despejado». Какой пересказ сохраняет причину и порядок событий?","options":["El grupo salió antes de la tormenta y esperó en la montaña a que se despejara el cielo.","El grupo retrasó la salida por la tormenta y encontró el cielo despejado al llegar.","La tormenta empezó después de que el grupo llegara a la montaña."],"answer":1,"explanation":"Retrasó la salida por la tormenta передаёт причину задержки, а encontró el cielo despejado al llegar показывает, что к прибытию уже прояснилось."}]]</script>
<script>

const icons = {
  home: '<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/>',
  map: '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zm6-3v15m6-12v15"/>',

  chart: '<path d="M4 20h17M7 16v-4m5 4V8m5 8V4"/>',

  compass: '<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/>',
  offline: '<path d="M3 8a14 14 0 0 1 17 0m-14 4a9 9 0 0 1 11 0m-8 4a4 4 0 0 1 5 0m-2 4h.01M3 3l18 18"/>',

  check: '<path d="m5 12 4 4L19 6"/>',

  book: '<path d="M12 7v13M3 5c4-1 7-.5 9 2 2-2.5 5-3 9-2v12c-4-1-7-.5-9 2-2-2.5-5-3-9-2z"/>',

};
const milestones = [
  { level: "A1", title: "Первые разговоры", detail: "Месяцы 1–3", first: 0 },
  { level: "A2", title: "Быт и поездки", detail: "Месяцы 4–6", first: 3 },
  { level: "B1", title: "Общение и своё мнение", detail: "Месяцы 7–12", first: 6 }
];

let route = "home";
let month = 0;
let weekToOpen = null;
let cardIndex = 0;
let translated = false;
let quizSelection = null;
let skipScope = "month";
let storageAvailable = true;
let preferences = { mode: "offline", weeks: [], quizzes: [], skippedMonths: [] };

function validIds(values, max) {
  if (!Array.isArray(values)) return [];
  return [...new Set(values.filter(value => Number.isInteger(value) && value >= 0 && value < max))];
}

function validatedWriting(entry, id) {
  if (!Array.isArray(entry?.answers) || entry.answers.length !== allWeeks[id].writing.questions.length ||
      !entry.answers.every(answer => typeof answer === "string")) return null;
  const answers = entry.answers.map(answer => answer.slice(0, maxWrittenLength));
  return answers.some(answer => answer.trim()) ? { answers, checked: entry.checked === true } : null;
}

function loadWriting(id, stored) {
  try {
    const entry = validatedWriting(JSON.parse(stored || "null"), id);
    if (entry) writtenWork[id] = entry;
    else delete writtenWork[id];
  } catch {
    delete writtenWork[id];
  }
}

try {
  const stored = JSON.parse(localStorage.getItem(storageKey) || "null");
  if (stored && typeof stored === "object") {
    preferences = {
      mode: stored.mode === "online" ? "online" : "offline",
      weeks: validIds(stored.weeks, totalWeeks),
      quizzes: validIds(stored.quizzes, course.length),
      skippedMonths: validIds(stored.skippedMonths, course.length)
    };
  }
  localStorage.setItem(storageKey, JSON.stringify(preferences));
  for (let id = 0; id < totalWeeks; id += 1) {
    loadWriting(id, localStorage.getItem(writingKeyPrefix + id));
  }
} catch {
  storageAvailable = false;
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(preferences));
    storageAvailable = true;
  } catch {
    storageAvailable = false;
  }
}

function saveWriting(id, entry) {
  if (entry) writtenWork[id] = entry;
  else delete writtenWork[id];
  try {
    if (entry) localStorage.setItem(writingKeyPrefix + id, JSON.stringify(entry));
    else localStorage.removeItem(writingKeyPrefix + id);
  } catch {
    storageAvailable = false;
  }
}

function importWriting(saved) {
  if (!saved) return;
  for (let id = 0; id < totalWeeks; id += 1) {
    const incoming = validatedWriting(saved[id], id);
    if (!incoming) continue;
    const current = writtenWork[id];
    if (!current) {
      saveWriting(id, incoming);
      continue;
    }
    const answers = current.answers.map((answer, i) => answer.trim() ? answer : incoming.answers[i]);
    if (answers.some((answer, i) => answer !== current.answers[i])) {
      const checked = incoming.checked && answers.every((answer, i) => answer === incoming.answers[i]);
      saveWriting(id, { answers, checked });
    }
  }
}

function announce(message) {
  document.querySelector("#announcement").textContent = message;
}

function icon(name, extraClass = "") {
  return `<svg class="icon ${extraClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
}

function external(url, label, style = "") {
  return `<a class="button ${style}" href="${url}" target="_blank" rel="noopener noreferrer">${label}${icon("external")}</a>`;
}

function videoLink(level) {
  return `${urls.video}${level}.html`;
}

function levelTag(level) {
  return `<span class="level-tag ${level.toLowerCase()}">${level}</span>`;
}

function weekCovered(week) {
  return preferences.weeks.includes(week) || preferences.skippedMonths.includes(Math.floor(week / 4));
}

function setWeekDone(id, done) {
  if (preferences.weeks.includes(id) !== done) {
    preferences.weeks = done ? [...preferences.weeks, id] : preferences.weeks.filter(week => week !== id);
    save();
  }
  const detail = main.querySelector(`[data-week-detail="${id}"]`);
  detail.querySelector("[data-week]").checked = done;
  const badge = detail.querySelector(".done-badge");
  badge.hidden = !weekCovered(id);
  badge.textContent = done ? "Готово" : "По тесту";
}

function coveredCount(start = 0, end = totalWeeks) {
  let count = 0;
  for (let week = start; week < end; week += 1) {
    if (weekCovered(week)) count += 1;
  }
  return count;
}

function firstIncomplete() {
  for (let week = 0; week < totalWeeks; week += 1) {
    if (!weekCovered(week)) return week;
  }
  return null;
}

function currentMonth() {
  return Math.floor((firstIncomplete() ?? totalWeeks - 1) / 4);
}

function plannedTask(week) {
  return preferences.mode === "online" ? week.online : week.offline;
}

function heading(kicker, title, description) {
  return `<div class="page-heading"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${description}</p></div>`;
}

function monthSelector() {
  return `<div class="selector" role="group" aria-label="Месяц обучения">${course.map((unit, index) =>
    `<button type="button" data-month="${index}" aria-pressed="${month === index}" aria-label="Месяц ${index + 1}, ${unit.level}, ${unit.title}">${index + 1} мес.</button>`
  ).join("")}</div>`;
}

function stat(iconName, value, label) {
  return `<div class="stat"><span class="stat-icon">${icon(iconName)}</span><div><strong>${value}</strong><small>${label}</small></div></div>`;
}

function homeView() {
  const next = firstIncomplete();
  const nextWeek = next === null ? null : course[currentMonth()].weeks[next % 4];
  const online = preferences.mode === "online";
  const covered = coveredCount();
  return `
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <div class="eyebrow">Индивидуальный план</div>
        <h1 id="hero-title">Испанский<br><span>с нуля до B1</span></h1>
        <p>Учись по самоучителю Малинской, закрепляй темы в Duolingo и практикуй речь по диалогам, даже без интернета.</p>
        <div class="hero-actions">
          <button class="button primary" type="button" data-action="continue">${next === null ? "Открыть прогресс" : covered ? "Продолжить обучение" : "Начать обучение"}${icon("arrow")}</button>
          <button class="button outline-light" type="button" data-action="download-app">${icon("download")}Скачать HTML</button>
        </div>
      </div>
    </section>
    <section class="stats" aria-label="Курс в цифрах">
      ${stat("calendar", "48 недель", "12 месяцев обучения")}
      ${stat("clock", "5–6 часов", "В неделю")}
      ${stat("circle", `${covered} из ${totalWeeks}`, "Недель зачтено")}
    </section>
    <div class="dashboard-grid">
      <section>
        <div class="section-title"><h2>Твой следующий шаг</h2></div>
        <div class="panel week-preview">
          <span class="week-square" aria-hidden="true">${next === null ? icon("check") : String(next + 1).padStart(2, "0")}</span>
          <div>
            <div class="soft-label">${nextWeek ? `Неделя ${next + 1} · ${course[currentMonth()].level}` : "План завершён"}</div>
            <h3>${nextWeek ? nextWeek.title : "Итоговая проверка B1"}</h3>
            <p>${nextWeek ? plannedTask(nextWeek) : course.at(-1).review}</p>
            <div class="week-preview-actions">
              <button class="text-button" type="button" data-action="continue">${nextWeek ? "К заданиям недели" : "Посмотреть прогресс"}${icon("arrow")}</button>
              ${nextWeek ? `<button class="text-button" type="button" data-skip-month="${currentMonth()}">Тест для пропуска${icon("arrow")}</button>` : ""}
            </div>
          </div>
        </div>
      </section>
      <section>
        <div class="section-title"><h2>Один учебный день</h2></div>
        <div class="panel">
          <ul class="routine">
            <li><span>${icon("book")} Самоучитель</span><strong>30 мин</strong></li>
            <li><span>${icon("spark")} ${online ? "Duolingo" : "Карточки и повторение"}</span><strong>15 мин</strong></li>
            <li><span>${icon("headphones")} ${online ? "Видео и устная практика" : "Диалог и устная практика"}</span><strong>15 мин</strong></li>
          </ul>
        </div>
      </section>
    </div>
    <section class="route-overview">
      <div class="section-title"><h2>Маршрут обучения</h2><button class="text-button" type="button" data-route="plan">Весь план${icon("arrow")}</button></div>
      <div class="levels">${milestones.map(step => `<button class="level-card" type="button" data-plan-month="${step.first}">${levelTag(step.level)}<strong>${step.title}</strong><small>${step.detail}</small></button>`).join("")}</div>
    </section>
  `;
}

function writtenTest(week, id) {
  const test = week.writing;
  const letterKeys = `<div class="writing-keys" data-writing-keys role="group" aria-label="Вставить испанскую букву">
    ${Array.from("áéíóúüñ", letter => `<button type="button" data-letter="${letter}" aria-label="Вставить ${letter}">${letter}</button>`).join("")}
  </div>`;

        <input type="text" lang="es" id="${fieldId}" data-writing-index="${index}" required maxlength="${maxWrittenLength}" autocomplete="off" autocorrect="off" spellcheck="false" aria-describedby="${fieldId}-feedback">
        ${index === 0 ? letterKeys : ""}
        <p class="writing-feedback" id="${fieldId}-feedback" data-writing-feedback></p>
      </div>`;
    }).join("")}
    <div class="writing-actions">
      <button class="button dark" type="submit">Проверить ответы${icon("check")}</button>
      <button class="button" type="button" data-action="continue" data-after-writing hidden>Продолжить обучение</button>
    </div>
    <p class="writing-score" data-writing-score role="status"></p>
  </form>`;
}

function normalizeWritten(value) {
  return value.normalize("NFC").toLocaleLowerCase("es").replace(/\p{P}+/gu, " ").trim().replace(/\s+/gu, " ");
}

function clearWritingFeedback(field) {
  field.setCustomValidity("");
  field.removeAttribute("aria-invalid");
  field.closest(".writing-question").querySelector("[data-writing-feedback]").textContent = "";
}

function gradeWriting(form, submit) {
  const id = Number(form.dataset.weekWriting);
  const questions = allWeeks[id].writing.questions;
  const fields = [...form.querySelectorAll("[data-writing-index]")];
  const answers = fields.map(field => field.value);
  const normalized = answers.map(normalizeWritten);
  const blank = normalized.indexOf("");
  if (blank >= 0) {
    if (submit) {
      fields[blank].setCustomValidity("Впиши ответ по-испански.");
      fields[blank].reportValidity();
    }
    return;
  }
  let right = 0;
  fields.forEach((field, index) => {
    const item = questions[index];
    const correct = item.answers.some(answer => normalizeWritten(answer) === normalized[index]);
    if (correct) right += 1;
    field.setAttribute("aria-invalid", String(!correct));
    const feedback = field.closest(".writing-question").querySelector("[data-writing-feedback]");
    feedback.textContent = correct ? "Верно." : `${item.hint} Пример ответа — «${item.answers[0]}».`;
  });
  const perfect = right === fields.length;
  if (submit) {
    saveWriting(id, { answers, checked: true });
    if (perfect) setWeekDone(id, true);
  }
  const credited = perfect && weekCovered(id);
  let message = `${right} из ${fields.length}. `;
  if (credited) message += "Неделя зачтена.";
  else if (perfect) message += "Все ответы верны.";
  else message += "Исправь отмеченные ответы и проверь ещё раз.";
  form.querySelector("[data-writing-score]").textContent = message;
  const next = form.querySelector("[data-after-writing]");
  next.hidden = !credited;
  next.textContent = firstIncomplete() === null ? "Открыть прогресс" : "Продолжить обучение";
}

function restoreWritingForm(form) {
  const entry = writtenWork[Number(form.dataset.weekWriting)];
  form.querySelectorAll("[data-writing-index]").forEach((field, index) => {
    const value = entry?.answers[index] ?? "";
    if (field.value !== value) field.value = value;
    clearWritingFeedback(field);
  });
  form.querySelector("[data-writing-score]").textContent = "";
  form.querySelector("[data-after-writing]").hidden = true;
  if (entry?.checked) gradeWriting(form, false);
}

  main.innerHTML = `

      `).join("")}</ul>
      <div class="resource-actions">
        ${passed
          ? `<button class="button dark" type="button" data-action="continue">${after}${icon("arrow")}</button>`
          : '<button class="button dark" type="button" data-action="retry-skip">Попробовать снова</button>'}

    </section>
    ${mistakes.length ? `<details class="panel review"><summary>Разбор ошибок</summary><ol class="skip-review">${mistakes.map(question => `
      <li><strong>${escapeText(question.question)}</strong><p>Твой ответ · ${escapeText(question.options[question.selected])}</p><p>Верный ответ · ${escapeText(question.options[question.answer])}</p><p>${escapeText(question.explanation)}</p></li>

  main.querySelector("[data-test-result]").focus({ preventScroll: true });

const views = { home: homeView, plan: planView, practice: practiceView, progress: progressView, resources: resourcesView, test: skipTestView };

function render() {
  document.querySelector("#page-name").textContent = pages[route];
  document.querySelectorAll(".navigation [data-route]").forEach(button => {
    if (button.dataset.route === route) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  });
  document.querySelectorAll("[data-mode]").forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.mode === preferences.mode));
  });
  main.innerHTML = views[route]();
  if (route === "plan") main.querySelectorAll("[data-week-writing]").forEach(restoreWritingForm);
}

function renderKeepingWeeks() {
  const opened = [...main.querySelectorAll(".week-detail[open]")].map(detail => detail.dataset.weekDetail);
  const active = document.activeElement;
  const focusedField = active?.matches("[data-writing-index]") ? active : null;
  weekToOpen = null;
  render();
  for (const id of opened) main.querySelector(`[data-week-detail="${id}"]`).open = true;
  if (focusedField) {
    const field = document.getElementById(focusedField.id);
    if (field) {
      field.focus({ preventScroll: true });
      field.setSelectionRange(focusedField.selectionStart, focusedField.selectionEnd);
    }
  }
}

function resetPractice() {
  cardIndex = 0;
  translated = false;
  quizSelection = null;
}

function go(nextRoute, nextMonth = currentMonth(), openWeek = null) {
  route = nextRoute;
  month = nextMonth;
  weekToOpen = openWeek;
  resetPractice();
  render();
  main.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "instant" });
}

function download(name, contents, mimeType) {
  const link = document.createElement("a");
  const objectUrl = URL.createObjectURL(new Blob([contents], { type: mimeType }));
  link.href = objectUrl;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
}

function redrawCards(focusAction) {
  const cards = document.querySelector("#cards");
  cards.innerHTML = flashcardMarkup();
  const focus = cards.querySelector(`[data-action="${focusAction}"]:not(:disabled)`) ?? cards.querySelector('[data-action="flip"]');
  focus.focus({ preventScroll: true });
}

const actions = {
  continue() {
    const next = firstIncomplete();
    if (next === null) go("progress");
    else go("plan", currentMonth(), next);
  },
  flip() {
    translated = !translated;
    redrawCards("flip");
    announce(decks[month][cardIndex][translated ? 1 : 0]);
  },
  "card-back"() {
    cardIndex -= 1;
    translated = false;
    redrawCards("card-back");
  },
  "card-next"() {
    cardIndex = (cardIndex + 1) % decks[month].length;
    translated = false;
    redrawCards("card-next");
  },
  export() {
    const backup = { version: 1, weeks: preferences.weeks, quizzes: preferences.quizzes, skippedMonths: preferences.skippedMonths, writing: writtenWork };
    download("ruta-espanola-progress.json", JSON.stringify(backup, null, 2), "application/json");
  },
  import() {
    document.querySelector("#import-file").click();
  },
  "download-app"() {
    download("ruta-espanola.html", originalHtml, "text/html;charset=utf-8");
  },
  "back-to-plan"() {
    go("plan", month);
  },
  "retry-skip"() {
    go("test", month);
  },
  "restore-month"() {
    preferences.skippedMonths = preferences.skippedMonths.filter(id => id !== month);
    save();
    renderKeepingWeeks();
    main.querySelector("[data-skip-month]").focus({ preventScroll: true });
    announce("Месяц возвращён в план.");
  }
};

document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || button.disabled) return;
  const data = button.dataset;
  if (data.letter) {
    const field = button.closest(".writing-question").querySelector("[data-writing-index]");
    const start = field.selectionStart;
    const end = field.selectionEnd;
    field.focus({ preventScroll: true });
    if (field.value.length - (end - start) + data.letter.length <= field.maxLength) {
      field.setRangeText(data.letter, start, end, "end");
      field.dispatchEvent(new Event("input", { bubbles: true }));
    }
  } else if (data.route) go(data.route);
  else if (data.planMonth !== undefined) go("plan", Number(data.planMonth), Number(data.planMonth) * 4);
  else if (data.practiceMonth !== undefined) go("practice", Number(data.practiceMonth));
  else if (data.skipMonth !== undefined) {
    skipScope = "month";
    go("test", Number(data.skipMonth));
  } else if (data.testScope && skipScope !== data.testScope) {
    skipScope = data.testScope;
    render();
    main.querySelector(`[data-test-scope="${skipScope}"]`).focus({ preventScroll: true });
  }
  else if (data.mode && data.mode !== preferences.mode) {
    preferences.mode = data.mode;
    save();
    if (route === "practice" || route === "progress" || route === "test") {
      document.querySelectorAll("[data-mode]").forEach(control => control.setAttribute("aria-pressed", String(control === button)));
    } else {
      renderKeepingWeeks();
    }
    announce(data.mode === "online" ? "Включён режим Онлайн." : "Включён режим Офлайн.");
  } else if (data.month !== undefined && Number(data.month) !== month) {
    month = Number(data.month);
    weekToOpen = null;
    resetPractice();
    render();
    main.querySelector(`[data-month="${month}"]`).focus({ preventScroll: true });
  } else if (data.answer !== undefined) {
    quizSelection = Number(data.answer);
    if (quizSelection === course[month].quiz.answer && !preferences.quizzes.includes(month)) {
      preferences.quizzes.push(month);
      save();
    }
    document.querySelector("#quiz").innerHTML = quizMarkup();
    main.querySelector(`[data-answer="${quizSelection}"]`).focus({ preventScroll: true });
  } else if (data.action && actions[data.action]) {
    actions[data.action]();
  }
});

document.addEventListener("submit", event => {
  const form = event.target;
  if (form.matches("[data-week-writing]")) {
    event.preventDefault();
    gradeWriting(form, true);
    return;
  }
  if (!form.matches("[data-skip-form]")) return;
  event.preventDefault();
  const answers = new FormData(form);
  let questionIndex = 0;
  const scores = scopeMonths().map(monthId => {
    const questions = skipQuestions[monthId].map(question => ({
      ...question,
      selected: Number(answers.get(`answer-${questionIndex++}`) ?? -1)
    }));
    return { monthId, questions, right: questions.filter(question => question.answer === question.selected).length };
  });
  if (scores.some(section => section.questions.some(question => !question.options[question.selected]))) return;
  const passed = scores.every(section => section.right >= 5);
  if (passed) {
    preferences.skippedMonths = validIds([...preferences.skippedMonths, ...scores.map(section => section.monthId)], course.length);
    save();
  }
  showSkipResult(scores, passed);
});

document.addEventListener("focusin", event => {
  const field = event.target;
  if (!field.matches("[data-writing-index]")) return;
  const keys = field.form.querySelector("[data-writing-keys]");
  if (field.nextElementSibling !== keys) field.after(keys);
});

document.addEventListener("input", event => {
  const field = event.target;
  if (!field.matches("[data-writing-index]")) return;
  const form = field.form;
  const id = Number(form.dataset.weekWriting);
  clearWritingFeedback(field);
  form.querySelector("[data-writing-score]").textContent = "";
  form.querySelector("[data-after-writing]").hidden = true;
  const answers = [...form.querySelectorAll("[data-writing-index]")].map(input => input.value);
  saveWriting(id, validatedWriting({ answers, checked: false }, id));
});

document.addEventListener("change", async event => {
  const input = event.target;
  if (input.dataset.week !== undefined) {
    const id = Number(input.dataset.week);
    setWeekDone(id, input.checked);
    if (writtenWork[id]?.checked) gradeWriting(input.closest(".week-detail").querySelector("[data-week-writing]"), false);
    const message = input.checked ? `Неделя ${id + 1} пройдена.` : `Отметка с недели ${id + 1} снята.`;
    announce(storageAvailable ? message : message + " Прогресс доступен до закрытия страницы.");
  }
  if (input.id === "import-file" && input.files.length) {
    const file = input.files[0];
    input.value = "";
    try {
      if (file.size > 256 * 1024) throw new Error("Unexpected size");
      const backup = JSON.parse(await file.text());
      if (backup?.version !== 1 || !Array.isArray(backup.weeks) || !Array.isArray(backup.quizzes) ||
        (backup.skippedMonths !== undefined && !Array.isArray(backup.skippedMonths)) ||
        (backup.writing !== undefined && (backup.writing === null || typeof backup.writing !== "object" || Array.isArray(backup.writing)))) throw new Error("Unexpected format");
      preferences.weeks = validIds([...preferences.weeks, ...backup.weeks], totalWeeks);
      preferences.quizzes = validIds([...preferences.quizzes, ...backup.quizzes], course.length);
      preferences.skippedMonths = validIds([...preferences.skippedMonths, ...(backup.skippedMonths ?? [])], course.length);
      save();
      importWriting(backup.writing);
      if (route === "progress") {
        render();
        document.querySelector("#storage-feedback").textContent = "Копия загружена. Отметки добавлены.";
      }
    } catch {
      const feedback = document.querySelector("#storage-feedback");
      if (feedback) feedback.textContent = "Не удалось прочитать копию. Выбери файл прогресса этого приложения.";
    }
  }
});

window.addEventListener("storage", event => {
  if (event.key?.startsWith(writingKeyPrefix)) {
    const suffix = event.key.slice(writingKeyPrefix.length);
    const id = Number(suffix);
    if (!Number.isInteger(id) || String(id) !== suffix || id < 0 || id >= totalWeeks) return;
    loadWriting(id, event.newValue);
    const form = main.querySelector(`[data-week-writing="${id}"]`);
    if (form) restoreWritingForm(form);
    return;
  }
  if (event.key !== storageKey || !event.newValue) return;
  try {
    const updated = JSON.parse(event.newValue);
    preferences.weeks = validIds(updated.weeks, totalWeeks);
    preferences.quizzes = validIds(updated.quizzes, course.length);
    preferences.skippedMonths = validIds(updated.skippedMonths, course.length);
    if (route === "home" || route === "progress") render();
    if (route === "plan") renderKeepingWeeks();
  } catch {
    // Ignore storage data from incompatible versions.
  }
});

function updateNetworkNotice() {
  if (preferences.mode !== "online" || (route !== "plan" && route !== "resources")) return;
  const notice = main.querySelector("[data-network-notice]");
  if (navigator.onLine) notice?.remove();
  else if (!notice) {
    const destination = main.querySelector(route === "plan" ? ".weeks" : ".resources-grid");
    destination.insertAdjacentHTML("beforebegin", '<p class="notice" data-network-notice>Браузер сообщает, что сети нет. Используй встроенную практику и задания в режиме Офлайн.</p>');
  }
}

window.addEventListener("online", updateNetworkNotice);
window.addEventListener("offline", updateNetworkNotice);
document.querySelectorAll("[data-icon]").forEach(node => { node.innerHTML = icon(node.dataset.icon); });
render();

</script>
</body>
</html>
